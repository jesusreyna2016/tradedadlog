<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>X Growth Agent · TradeDadLog</title>
<link rel="icon" href="/favicon.ico" />
<style>
  :root{
    --bg:#0b0e13; --panel:#12161f; --panel2:#171c27; --line:#232a38;
    --txt:#e7ecf4; --muted:#8b97ab; --dim:#5c6779;
    --accent:#4da3ff; --green:#3fd08b; --amber:#f0b74a; --red:#f2637e; --violet:#9d7bff;
    --radius:14px; --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font-family:var(--sans);
    -webkit-font-smoothing:antialiased;line-height:1.5}
  a{color:var(--accent);text-decoration:none}
  .wrap{max-width:1080px;margin:0 auto;padding:22px 18px 60px}
  header.top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:20px}
  .brand h1{font-size:19px;margin:0;letter-spacing:.2px}
  .brand .sub{color:var(--muted);font-size:13px;margin-top:3px}
  .updated{font-size:12px;color:var(--dim);font-family:var(--mono);text-align:right}
  .updated b{color:var(--muted);font-weight:600}

  .grid{display:grid;gap:14px}
  .stats{grid-template-columns:repeat(4,1fr)}
  @media(max-width:720px){.stats{grid-template-columns:repeat(2,1fr)}}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
  .stat .k{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}
  .stat .v{font-size:30px;font-weight:700;margin-top:6px;font-variant-numeric:tabular-nums}
  .stat .d{font-size:12px;margin-top:4px;font-family:var(--mono)}
  .up{color:var(--green)} .down{color:var(--red)}

  .section-title{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);
    margin:26px 2px 10px;display:flex;align-items:center;gap:8px}
  .section-title .line{flex:1;height:1px;background:var(--line)}

  .plan{background:linear-gradient(180deg,#141a26,#12161f);border:1px solid var(--line);
    border-left:3px solid var(--accent);border-radius:12px;padding:13px 15px;font-size:14px;color:var(--txt)}

  .drafts{grid-template-columns:1fr}
  .draft{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:15px;position:relative}
  .draft .head{display:flex;align-items:center;gap:9px;margin-bottom:10px;flex-wrap:wrap}
  .rankbadge{width:24px;height:24px;border-radius:7px;display:grid;place-items:center;font-size:12px;
    font-weight:700;background:#1d2532;color:var(--muted)}
  .draft.r1 .rankbadge{background:var(--accent);color:#06121f}
  .chip{font-size:11px;font-weight:600;padding:3px 9px;border-radius:999px;text-transform:uppercase;letter-spacing:.5px}
  .chip.aphorism{background:rgba(157,123,255,.16);color:var(--violet)}
  .chip.confession{background:rgba(242,99,126,.15);color:var(--red)}
  .chip.question{background:rgba(77,163,255,.15);color:var(--accent)}
  .chip\.truth-bomb,.chip.truthbomb{background:rgba(240,183,74,.15);color:var(--amber)}
  .chip.pattern{background:rgba(63,208,139,.15);color:var(--green)}
  .draft .why{font-size:12.5px;color:var(--muted);margin-left:auto}
  .draft pre{font-family:var(--sans);font-size:14.5px;white-space:pre-wrap;margin:0;color:#eef2f8;
    background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:13px 14px}
  .draft .foot{display:flex;justify-content:space-between;align-items:center;margin-top:9px;gap:10px}
  .src{font-size:11.5px;color:var(--dim);font-family:var(--mono)}
  .copy{border:1px solid var(--line);background:var(--panel2);color:var(--txt);font-size:12.5px;
    padding:6px 13px;border-radius:8px;cursor:pointer;font-weight:600;transition:.15s}
  .copy:hover{border-color:var(--accent);color:var(--accent)}
  .copy.ok{border-color:var(--green);color:var(--green)}

  .read{grid-template-columns:repeat(3,1fr)}
  @media(max-width:720px){.read{grid-template-columns:1fr}}
  .read .card{border-top:3px solid var(--line)}
  .read .working{border-top-color:var(--green)} .read .stop{border-top-color:var(--red)} .read .watch{border-top-color:var(--amber)}
  .read h4{margin:0 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.6px}
  .read .working h4{color:var(--green)} .read .stop h4{color:var(--red)} .read .watch h4{color:var(--amber)}
  .read p{margin:0;font-size:13.5px;color:var(--txt)}

  .two{grid-template-columns:1.3fr 1fr}
  @media(max-width:820px){.two{grid-template-columns:1fr}}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{text-align:left;color:var(--muted);font-weight:600;font-size:11px;text-transform:uppercase;
    letter-spacing:.5px;padding:7px 8px;border-bottom:1px solid var(--line)}
  td{padding:8px;border-bottom:1px solid #1a2028;font-variant-numeric:tabular-nums}
  tr:last-child td{border-bottom:none}
  .post-ex{color:var(--txt);max-width:340px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .best td{background:rgba(63,208,139,.06)} .worst td{color:var(--muted)}
  .mini{font-size:11px;color:var(--dim)}

  .bars{display:flex;flex-direction:column;gap:10px}
  .bar{display:grid;grid-template-columns:92px 1fr auto;align-items:center;gap:10px;font-size:12.5px}
  .bar .lbl{color:var(--muted);text-transform:capitalize}
  .bar .track{height:9px;background:#1a2028;border-radius:6px;overflow:hidden}
  .bar .fill{height:100%;border-radius:6px}
  .bar .val{font-family:var(--mono);color:var(--txt);font-size:12px}

  .predict{display:flex;gap:13px;align-items:flex-start}
  .predict .dot{width:9px;height:9px;border-radius:50%;margin-top:6px;flex:none;background:var(--amber)}
  .predict .claim{font-size:14px} .predict .meta{font-size:11.5px;color:var(--dim);font-family:var(--mono);margin-top:3px}

  .engage li,.bl li{list-style:none} ul{margin:0;padding:0}
  .engage li{padding:10px 0;border-bottom:1px solid #1a2028}
  .engage li:last-child{border:none}
  .engage .h{font-weight:600;font-size:13.5px;color:var(--accent)}
  .engage .ex{font-size:12.5px;color:var(--muted);margin:2px 0}
  .engage .wy{font-size:12px;color:var(--txt)}
  .bl-cols{grid-template-columns:1fr 1fr}
  @media(max-width:720px){.bl-cols{grid-template-columns:1fr}}
  .bl li{padding:7px 0;font-size:13px;border-bottom:1px solid #1a2028;color:var(--txt)}
  .bl li:last-child{border:none}
  .bl h4{margin:0 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted)}
  .bl .open h4{color:var(--accent)} .bl .used h4{color:var(--dim)}
  .bl .used li{color:var(--muted)}
  footer{margin-top:34px;text-align:center;color:var(--dim);font-size:12px;font-family:var(--mono)}
  .err{color:var(--red);font-family:var(--mono);font-size:13px;padding:20px}
</style>
</head>
<body>
<div class="wrap" id="app">
  <div class="err" id="loading">Loading agent data…</div>
</div>

<script>
const fmt = n => n==null ? "—" : (n>=1000 ? (n/1000).toFixed(n>=10000?0:1)+"K" : ""+n);
const esc = s => (s==null?"":String(s)).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const clsFmt = f => (f||"").replace(/[^a-z]/g,"");

fetch("/x-growth-data.json?v="+Date.now())
  .then(r=>{ if(!r.ok) throw new Error("data "+r.status); return r.json(); })
  .then(render)
  .catch(e=>{ document.getElementById("loading").textContent = "Could not load x-growth-data.json ("+e.message+")"; });

function render(d){
  const fh = d.followerHistory||[];
  const first = fh.length?fh[0].followers:null, last = d.account.followers;
  const delta = (first!=null)? last-first : null;

  const posts = (d.recentPosts||[]).filter(p=>p.views!=null);
  const maxV = Math.max(1,...posts.map(p=>p.views));
  const bestId = posts.length? posts.reduce((a,b)=>a.views>b.views?a:b).id : null;

  const fp = d.formatPerformance||[];
  const maxFp = Math.max(1,...fp.map(f=>f.medianViews));
  const fpColor = {aphorism:"var(--violet)",confession:"var(--red)",question:"var(--accent)","truth-bomb":"var(--amber)",pattern:"var(--green)"};

  const spark = sparkline(fh.map(p=>p.followers));

  const draftCard = dr => `
    <div class="draft ${dr.rank===1?'r1':''}">
      <div class="head">
        <span class="rankbadge">${dr.rank}</span>
        <span class="chip ${clsFmt(dr.format)}">${esc(dr.format)}</span>
        <span class="why">${esc(dr.why)}</span>
      </div>
      <pre id="dr${dr.rank}">${esc(dr.text)}</pre>
      <div class="foot">
        <span class="src">${esc(dr.source)}</span>
        <button class="copy" data-t="dr${dr.rank}">Copy</button>
      </div>
    </div>`;

  const html = `
  <header class="top">
    <div class="brand">
      <h1>X Growth Agent</h1>
      <div class="sub">@${esc(d.account.handle)} · organic growth engine</div>
    </div>
    <div class="updated">updated <b>${esc(d.updated)}</b><br>cycle #${esc(d.cycle)}</div>
  </header>

  <div class="grid stats">
    <div class="card stat">
      <div class="k">Followers</div>
      <div class="v">${fmt(last)}</div>
      <div class="d ${delta>=0?'up':'down'}">${delta==null?"":(delta>=0?"▲ +"+delta:"▼ "+delta)+" since "+esc(fh[0].date)}</div>
    </div>
    <div class="card stat">
      <div class="k">Trend</div>
      <div style="margin-top:10px">${spark}</div>
    </div>
    <div class="card stat">
      <div class="k">Posts</div>
      <div class="v">${fmt(d.account.posts)}</div>
    </div>
    <div class="card stat">
      <div class="k">This week</div>
      <div class="v">${(d.drafts||[]).length}</div>
      <div class="d" style="color:var(--muted)">drafts ready</div>
    </div>
  </div>

  <div class="section-title">This week's plan <span class="line"></span></div>
  <div class="plan">${esc(d.plan)}</div>

  <div class="section-title">Drafts, ready to post <span class="line"></span></div>
  <div class="grid drafts">${(d.drafts||[]).sort((a,b)=>a.rank-b.rank).map(draftCard).join("")}</div>

  <div class="section-title">The read <span class="line"></span></div>
  <div class="grid read">
    <div class="card working"><h4>Working</h4><p>${esc(d.read?.working)}</p></div>
    <div class="card stop"><h4>Stop doing</h4><p>${esc(d.read?.stop)}</p></div>
    <div class="card watch"><h4>Idea to watch</h4><p>${esc(d.read?.watch)}</p></div>
  </div>

  <div class="section-title">Performance <span class="line"></span></div>
  <div class="grid two">
    <div class="card">
      <table>
        <thead><tr><th>Post</th><th>Format</th><th>Views</th><th>Likes</th><th>Replies</th></tr></thead>
        <tbody>
        ${(d.recentPosts||[]).map(p=>`
          <tr class="${p.id===bestId?'best':''} ${p.views!=null&&p.views<600?'worst':''}">
            <td><a class="post-ex" href="https://x.com/${esc(d.account.handle)}/status/${esc(p.id)}" target="_blank" title="${esc(p.excerpt)}">${esc(p.excerpt)}</a><div class="mini">${esc(p.date)}${p.note?" · "+esc(p.note):""}</div></td>
            <td><span class="chip ${clsFmt(p.format)}" style="font-size:10px">${esc(p.format)}</span></td>
            <td>${fmt(p.views)}</td><td>${fmt(p.likes)}</td><td>${fmt(p.replies)}</td>
          </tr>`).join("")}
        </tbody>
      </table>
    </div>
    <div class="card">
      <div class="mini" style="margin-bottom:10px">Median views by format</div>
      <div class="bars">
      ${fp.map(f=>`
        <div class="bar">
          <span class="lbl">${esc(f.format)}</span>
          <span class="track"><span class="fill" style="width:${Math.max(4,f.medianViews/maxFp*100)}%;background:${fpColor[f.format]||'var(--accent)'}"></span></span>
          <span class="val">${fmt(f.medianViews)}${f.count?`<span class="mini"> ·n${f.count}</span>`:''}</span>
        </div>`).join("")}
      </div>
    </div>
  </div>

  <div class="section-title">Weekly prediction <span class="line"></span></div>
  <div class="card predict">
    <span class="dot" style="background:${d.prediction?.status==='hit'?'var(--green)':d.prediction?.status==='miss'?'var(--red)':'var(--amber)'}"></span>
    <div><div class="claim">${esc(d.prediction?.claim)}</div>
    <div class="meta">${esc(d.prediction?.week)} · status: ${esc(d.prediction?.status||'pending')}</div></div>
  </div>

  <div class="section-title">Who to engage this week <span class="line"></span></div>
  <div class="card engage"><ul>
  ${(d.engageList||[]).map(e=>`<li><div class="h">${esc(e.handle)}</div><div class="ex">${esc(e.postExcerpt)}</div><div class="wy">${esc(e.whyReply)}</div></li>`).join("")}
  </ul></div>

  <div class="section-title">Ideas backlog <span class="line"></span></div>
  <div class="grid bl-cols">
    <div class="card bl open"><h4>Open</h4><ul>${(d.backlog?.open||[]).map(i=>`<li>${esc(i)}</li>`).join("")}</ul></div>
    <div class="card bl used"><h4>Used</h4><ul>${(d.backlog?.used||[]).map(i=>`<li>${esc(i)}</li>`).join("")}</ul></div>
  </div>

  <div class="section-title">Draft scorecard <span class="line"></span></div>
  <div class="card">
    <table>
      <thead><tr><th>Week</th><th>Draft</th><th>Format</th><th>Adopted</th><th>Result</th></tr></thead>
      <tbody>
      ${(d.scorecard||[]).map(s=>`<tr><td>${esc(s.week)}</td><td>${esc(s.draft)}</td><td>${esc(s.format)}</td><td>${esc(s.adopted)}</td><td>${s.url?`<a href="${esc(s.url)}" target="_blank">${esc(s.result||'view')}</a>`:esc(s.result||'—')}</td></tr>`).join("")}
      </tbody>
    </table>
  </div>

  <footer>X Growth Agent · runs interactively, writes here every cycle · @${esc(d.account.handle)}</footer>
  `;
  document.getElementById("app").innerHTML = html;

  document.querySelectorAll(".copy").forEach(b=>b.addEventListener("click",()=>{
    const t = document.getElementById(b.dataset.t).textContent;
    navigator.clipboard.writeText(t).then(()=>{ b.textContent="Copied"; b.classList.add("ok");
      setTimeout(()=>{b.textContent="Copy";b.classList.remove("ok");},1400); });
  }));
}

function sparkline(vals){
  if(!vals||vals.length<2) return '<div class="mini">not enough data</div>';
  const w=140,h=44,pad=4;
  const mn=Math.min(...vals),mx=Math.max(...vals),rng=(mx-mn)||1;
  const pts=vals.map((v,i)=>[pad+i*(w-2*pad)/(vals.length-1), h-pad-(v-mn)/rng*(h-2*pad)]);
  const dpath=pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");
  const area=dpath+` L${pts[pts.length-1][0].toFixed(1)} ${h-pad} L${pts[0][0].toFixed(1)} ${h-pad} Z`;
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">
    <path d="${area}" fill="rgba(63,208,139,.12)"/>
    <path d="${dpath}" fill="none" stroke="var(--green)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="${pts[pts.length-1][0].toFixed(1)}" cy="${pts[pts.length-1][1].toFixed(1)}" r="3" fill="var(--green)"/>
  </svg>`;
}
</script>
</body>
</html>
