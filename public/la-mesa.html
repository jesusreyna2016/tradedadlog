<title>La Mesa</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,900&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* La Mesa — no es un tablero, es una presencia. Una voz + una decisión + el terreno.
   Mundo: tinta cálida casi negra, una sola brasa de acento, tipografía editorial grande. */
:root{
  color-scheme: dark;
  --ink:#0c0b0a; --ink2:#141210; --panel:#191613; --line:#2a2622; --line2:#3b352e;
  --fg:#efe9df; --fg2:#cbc3b6; --muted:#8c8276; --faint:#5f574c;
  --ember:#e08a3c; --ember-soft:#f2b06a; --ember-dim:rgba(224,138,60,.13);
  --go:#5bd48a; --wait:#e8b84b; --avoid:#ff6a5c;
  --go-dim:rgba(91,212,138,.13); --wait-dim:rgba(232,184,75,.12); --avoid-dim:rgba(255,106,92,.13);
  --disp:"Fraunces",Georgia,serif;
  --body:"Inter",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
body{background:var(--ink);color:var(--fg);font-family:var(--body);margin:0;line-height:1.5;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(130% 80% at 85% -10%,rgba(224,138,60,.07),transparent 50%)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:#060504}
.wrap{max-width:860px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));padding-block:0 72px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* top status — barely there */
.top{display:flex;align-items:center;gap:14px;padding-block:16px 10px;font-family:var(--mono);font-size:.68rem;color:var(--muted);flex-wrap:wrap}
.top .dot{width:7px;height:7px;border-radius:50%;background:var(--go);box-shadow:0 0 8px var(--go)}
.top .dot.stale{background:var(--wait);box-shadow:0 0 8px var(--wait)}
.top .dot.off{background:var(--avoid);box-shadow:0 0 8px var(--avoid)}
.top .sep{color:var(--faint)}
.top .sp{flex:1}
.lang{display:inline-flex;gap:0;border:1px solid var(--line2);border-radius:6px;overflow:hidden}
.lang button{background:transparent;color:var(--muted);border:0;padding:3px 8px;cursor:pointer;font-family:var(--mono);font-size:.64rem;font-weight:700}
.lang button[aria-pressed="true"]{background:var(--ember);color:#1a0f06}

/* instrument switcher — text, not cards */
.switch{display:flex;gap:2px;flex-wrap:wrap;margin:6px 0 30px;border-bottom:1px solid var(--line)}
.switch button{background:transparent;border:0;border-bottom:2px solid transparent;color:var(--muted);
  font-family:var(--disp);font-weight:600;font-size:1.02rem;padding:8px 14px 10px;cursor:pointer;margin-bottom:-1px;letter-spacing:.01em}
.switch button .v{font-family:var(--mono);font-size:.55rem;display:block;margin-top:2px;letter-spacing:.08em}
.switch button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--ember)}
.switch button .v.v-GO{color:var(--go)}.switch button .v.v-WAIT{color:var(--wait)}.switch button .v.v-AVOID{color:var(--avoid)}

/* ACT I — voice + decision */
.act1{display:grid;grid-template-columns:1fr auto;gap:10px 28px;align-items:end;margin-bottom:8px}
@media(max-width:620px){.act1{grid-template-columns:1fr}}
.eyebrow{font-family:var(--mono);font-size:.64rem;letter-spacing:.2em;text-transform:uppercase;color:var(--faint);margin-bottom:12px}
.eyebrow b{color:var(--ember-soft)}
.decision{font-family:var(--disp);font-weight:900;font-size:clamp(2.2rem,7vw,3.4rem);line-height:.92;letter-spacing:-.02em;margin:0;text-wrap:balance}
.decision.d-GO{color:var(--go)}.decision.d-WAIT{color:var(--wait)}.decision.d-AVOID{color:var(--avoid)}
.decision.d-REST{color:var(--faint);font-weight:600;font-size:clamp(1.7rem,4.5vw,2.4rem)}
.decision.d-LOCK{color:var(--muted);font-weight:900;font-size:clamp(1.8rem,4.8vw,2.6rem);opacity:.85}
.healthline{font-family:var(--mono);font-size:.62rem;letter-spacing:.06em;line-height:1.4;color:var(--wait);margin:2px 0 0;max-width:52ch}
.discrev{font-family:var(--body);font-size:.9rem;line-height:1.55;color:var(--fg2);margin-top:16px;padding:14px 17px;border:1px solid var(--line);border-radius:14px;background:var(--ink2)}
.discrev .k{font-family:var(--mono);font-size:.6rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-right:9px}
.discrev .v{color:var(--avoid);font-weight:600}
.decrip{font-family:var(--mono);font-size:.7rem;color:var(--muted);text-align:right;padding-bottom:12px;white-space:nowrap}
@media(max-width:620px){.decrip{text-align:left}}
.voice{font-family:var(--disp);font-weight:400;font-size:clamp(1rem,2.2vw,1.2rem);line-height:1.5;color:var(--fg);
  max-width:46ch;margin:14px 0 0;text-wrap:pretty}
.voice .hl{color:var(--ember-soft);font-weight:600}
.voice .warn{color:var(--avoid);font-weight:600}
.voice .nums{font-family:var(--mono);font-size:.82em;color:var(--fg2)}
.aside{font-family:var(--body);font-size:.84rem;color:var(--muted);margin-top:16px;padding-top:14px;border-top:1px solid var(--line);max-width:46ch}
.aside .k{font-family:var(--mono);font-size:.6rem;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);margin-right:8px}
.aside b{color:var(--fg2)}

/* ACT II — el terreno */
.terrain-wrap{margin:38px 0 0}
.terrain-head{display:flex;align-items:baseline;gap:12px;margin-bottom:12px}
.terrain-head h2{font-family:var(--disp);font-weight:600;font-size:1.05rem;margin:0}
.terrain-head .where{font-family:var(--mono);font-size:.72rem;margin-left:auto;padding:3px 9px;border-radius:20px}
.where.edge{color:var(--ember-soft);background:var(--ember-dim)}
.where.nml{color:var(--muted);background:rgba(140,130,118,.1)}
#terrain{width:100%;height:auto;aspect-ratio:820/360;display:block}
.tcaption{font-family:var(--mono);font-size:.64rem;color:var(--faint);margin-top:8px;text-align:center}

/* ACT III — woven truths */
.truths{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:40px}
@media(max-width:620px){.truths{grid-template-columns:1fr}}
.truth{border-top:1px solid var(--line);padding-top:16px}
.truth .k{font-family:var(--mono);font-size:.62rem;letter-spacing:.18em;text-transform:uppercase;color:var(--faint);margin-bottom:12px}
/* two minds */
.minds{display:flex;align-items:center;gap:14px;margin-bottom:12px}
.minds .score{font-family:var(--disp);font-weight:900;font-size:2.4rem;line-height:1}
.minds .lab{font-size:.8rem;color:var(--muted);line-height:1.3}
.mindrow{display:flex;align-items:center;gap:8px;font-size:.78rem;padding:5px 0;border-top:1px solid var(--line)}
.mindrow:first-of-type{border-top:0}
.mindrow .s{font-family:var(--disp);font-weight:600;width:34px}
.mindrow .pair{font-family:var(--mono);font-size:.72rem;display:flex;gap:6px;align-items:center;margin-left:auto}
.vd{font-family:var(--mono);font-size:.64rem;font-weight:700;padding:1px 6px;border-radius:4px}
.vd.v-GO{color:var(--go);background:var(--go-dim)}.vd.v-WAIT{color:var(--wait);background:var(--wait-dim)}.vd.v-AVOID{color:var(--avoid);background:var(--avoid-dim)}
.mindrow.div{color:var(--ember-soft)}.mindrow.div .vs{color:var(--ember)}
/* confidence */
.conf p{font-size:.86rem;color:var(--fg2);line-height:1.5;margin:0 0 10px}
.conf .big{font-family:var(--disp);font-weight:600;color:var(--fg)}
.conf .flag{color:var(--avoid);font-weight:600}
.conf .mini{font-family:var(--mono);font-size:.68rem;color:var(--muted);display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.conf .mini span{border:1px solid var(--line2);border-radius:5px;padding:2px 7px}
.err{font-family:var(--mono);font-size:.74rem;color:var(--wait)}
.skel{font-family:var(--mono);font-size:.76rem;color:var(--faint)}
.foot{margin-top:44px;padding-top:16px;border-top:1px solid var(--line);font-size:.72rem;color:var(--faint);line-height:1.6}
/* salud del sistema */
.top .hdot{width:7px;height:7px;border-radius:50%;background:var(--go);box-shadow:0 0 8px var(--go)}
.top .hdot.warn{background:var(--wait);box-shadow:0 0 8px var(--wait)}
.top .hdot.bad{background:var(--avoid);box-shadow:0 0 8px var(--avoid)}
.top .planage{color:var(--muted)}
.top .planage.old{color:var(--wait)}
.sysline{font-family:var(--body);font-size:.82rem;line-height:1.55;margin:2px 0 0;padding:11px 13px;border-radius:9px;border:1px solid var(--line2);background:var(--panel)}
.sysline.ok{display:none}
.sysline .k{font-family:var(--mono);font-size:.58rem;letter-spacing:.14em;text-transform:uppercase;margin-right:9px}
.sysline.warn{border-color:rgba(232,184,75,.4)}.sysline.warn .k{color:var(--wait)}
.sysline.bad{border-color:rgba(255,106,92,.45)}.sysline.bad .k{color:var(--avoid)}
/* jerga con explicación al pasar el cursor */
.voice abbr.t,.aside abbr.t,.sysline abbr.t{text-decoration:underline dotted var(--line2);text-underline-offset:3px;cursor:help;color:inherit}
@keyframes freshpulse{0%{color:var(--ember-soft)}100%{color:inherit}}
.fresh{animation:freshpulse 1.8s ease-out}
@keyframes drawpath{to{stroke-dashoffset:0}}
#terrain .ppath{stroke-dasharray:6000;stroke-dashoffset:6000;animation:drawpath 1.1s ease-out forwards}
@media(prefers-reduced-motion:reduce){#terrain .ppath{animation:none;stroke-dashoffset:0}}
.pulso{margin-top:34px}
.pulso-head{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:14px}
.pulso-head h2{font-family:var(--disp);font-weight:600;font-size:1.15rem;letter-spacing:-.01em;margin:0}
.pulso-head span{font-family:var(--mono);font-size:.58rem;letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
.pulso-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:12px}
.pcard{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:14px 15px 15px}
.pcard .pk{font-family:var(--mono);font-size:.62rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-bottom:9px}
.pcard .pbig{font-family:var(--disp);font-size:1.7rem;line-height:1;font-weight:600;letter-spacing:-.01em}
.pcard .pbig small{font-size:.8rem;color:var(--muted);font-weight:400}
.pcard .psub{font-size:.76rem;line-height:1.5;color:var(--fg2);margin-top:11px}
.pcard .psub b{color:var(--fg);font-weight:600}
.ptrack{height:7px;border-radius:4px;background:var(--line2);margin-top:12px;overflow:hidden}
.pfill{height:100%;border-radius:4px}
.prow{display:flex;justify-content:space-between;font-family:var(--mono);font-size:.72rem;padding:3px 0;color:var(--muted)}
.prow.me{color:var(--fg);border-top:1px solid var(--line);margin-top:2px;padding-top:6px}
.gate{margin:14px 0 0;padding:12px 15px;border-radius:11px;border:1px solid var(--line2);background:var(--panel)}
.gate .glead{font-family:var(--mono);font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;display:flex;align-items:center;gap:8px;color:var(--fg2)}
.gate .gdot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:0 0 auto}
.gate .gbody{font-family:var(--disp);font-size:clamp(1.05rem,2.4vw,1.25rem);line-height:1.35;margin-top:6px;color:var(--fg)}
.gate .gnear{font-family:var(--mono);font-size:.7rem;color:var(--muted);margin-top:8px;line-height:1.5}
.gate .gnear b{color:var(--fg2);font-weight:500}
.gate.zone{border-color:rgba(91,212,138,.5)}.gate.zone .gdot{background:var(--go);box-shadow:0 0 8px var(--go)}.gate.zone .glead{color:var(--go)}
.gate.edge{border-color:rgba(232,184,75,.45)}.gate.edge .gdot{background:var(--wait);box-shadow:0 0 8px var(--wait)}.gate.edge .glead{color:var(--wait)}
.gate.nml{border-color:rgba(255,106,92,.4)}.gate.nml .gdot{background:var(--avoid);box-shadow:0 0 8px var(--avoid)}.gate.nml .glead{color:var(--avoid)}
</style>

const GLOSS={es:{

 "VWAP":"precio medio del día ponderado por volumen; la referencia de precio justo del día",
 "CHoCH":"primer aviso de que la dirección podría estar cambiando",
 "BOS":"ruptura de estructura: la tendencia queda confirmada",
 "FEED1":"la fuente de niveles en vivo; si no llega, el plan va con datos de días atrás",
 "orb":"rango de apertura: el primer rango de precios del día, que suele marcar los límites",
 "POC":"el precio donde más se negoció ayer; actúa como imán",
 "VAH":"borde alto de la zona donde más se negoció ayer",
 "VAL":"borde bajo de la zona donde más se negoció ayer",
 "PDH":"máximo del día anterior",
 "PDL":"mínimo del día anterior",
 "TDO":"precio de apertura del día de trading",
 "FVG":"un hueco que dejó el precio al moverse rápido; el mercado suele volver a rellenarlo",
 "SMT":"desacuerdo entre dos índices parecidos; a veces adelanta un giro",
 "BE":"break-even: mover el stop al precio de entrada para no arriesgar nada ya",
 "stop":"stop-loss: el precio donde cierras la pérdida si te equivocas"},
 en:{
 "EMA50":"50-bar moving average: the recent average price; often acts as a floor or ceiling",
 "EMA20":"20-bar moving average (your fast one): the recent average price; often acts as a floor or ceiling",
 "EMA15":"this is your EMA20 measured on the 15-minute timeframe (the 15 is the timeframe, not the length; you use EMA20 and EMA50)",
 "EMA5":"this is your EMA20 measured on the chart (not a 5-period average)",
 "VWAP":"volume-weighted average price of the day; the day's fair-value reference",
 "CHoCH":"first hint that direction may be changing",
 "BOS":"break of structure: the trend is confirmed",
 "FEED1":"the live levels source; if it doesn't arrive, the plan runs on older data",
 "orb":"opening range: the day's first price range, often the day's bounds",
 "POC":"the price where most trading happened yesterday; acts like a magnet",
 "VAH":"top edge of yesterday's heaviest-traded zone",
 "VAL":"bottom edge of yesterday's heaviest-traded zone",
 "PDH":"previous day's high","PDL":"previous day's low",
 "TDO":"trading-day opening price",
 "FVG":"a gap price left while moving fast; the market tends to fill it back",
 "SMT":"disagreement between two similar indexes; sometimes leads a turn",
 "BE":"break-even: move the stop to your entry so you risk nothing more",
 "stop":"stop-loss: the price where you cut the loss if you're wrong"}};
function gloss(s){if(!s)return s;const g=GLOSS[LANG]||GLOSS.es;
  Object.keys(g).sort((a,b)=>b.length-a.length).forEach(term=>{
    const esc=term.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
    const re=new RegExp("(^|[^\\w>])("+esc+")(?![\\w])");
    if(re.test(s))s=s.replace(re,`$1<abbr class="t" title="${g[term]}">$2</abbr>`);});
  return s;}
function ptype(ty){const m={es:{pullback_cont:"un retroceso que luego sigue la tendencia",reversal:"un giro",poc_reversion:"una vuelta al centro de valor de ayer",breakout:"una ruptura"},
  en:{pullback_cont:"a pullback that then continues the trend",reversal:"a reversal",poc_reversion:"a return to yesterday's value center",breakout:"a breakout"}};
  return (m[LANG]||m.es)[ty]||(ty||"").replace(/_/g," ");}
function nearest(d){const arr=[];
  (d.zones||[]).forEach(z=>{if(z.distPts!=null)arr.push({d:Math.abs(z.distPts),name:ptype(z.type)});});
  (d.keyLevels||[]).forEach(k=>{if(k.distPts!=null)arr.push({d:Math.abs(k.distPts),name:tr(k.name)});});
  arr.sort((a,b)=>a.d-b.d);return arr[0]||null;}
function edgeLoses(){try{return S.edge&&S.edge.overall&&S.edge.overall.expRnet<0;}catch(e){return false;}}
function N(x){return `<span class="nums">${num(x)}</span>`;}
// bloqueo = estado LOCKOUT del Coach (stop del día perdido o 3 pérdidas seguidas), y SOLO si es de hoy
// (no un trader.json viejo de un día de bloqueo anterior). Ver tos-coach.mjs.
const LOCKOUT_UI=false; // interruptor: true vuelve a apagar la decision en bloqueo (desactivado hasta configurar las reglas)
function lockedNow(){if(!LOCKOUT_UI)return false;const c=S.coach;if(!c||c.__err)return false;if((c.state||"").toUpperCase()!=="LOCKOUT")return false;
  // el Coach recalcula el estado cada corrida y el bloqueo se limpia al nuevo día de trading;
  // confía en el LOCKOUT solo si el Coach corrió hace poco (asOf), no en un trader.json viejo.
  try{if(!c.asOf)return true;return (Date.now()-Date.parse(c.asOf))<20*3600e3;}catch(e){return true;}}

/* la voz: en lenguaje llano, armada desde los datos (no vuelca la jerga cruda del plan).
   Entendible aunque no sepas de trading; los términos técnicos quedan con explicación al pasar el cursor. */
function plainVoice(sym,d){
  const parts=[];const sg=(d.verdict&&d.verdict.signal)||"WAIT";
  const coach=S.coach&&!S.coach.__err?S.coach:null;
  if(lockedNow()){
    parts.push(`<span class="warn">${t("lockout")}</span> ${LANG==="es"?"Perdiste el stop del día o encadenaste pérdidas seguidas: hoy ya no se opera, diga lo que diga el plan.":"You hit the day stop or strung losses together: no more trading today, whatever the plan says."}`);
  } else if(coach&&(coach.todayViolations>0)){
    parts.push(`<span class="warn">${LANG==="es"?"Ojo contigo hoy":"Watch yourself today"}:</span> ${coach.todayViolations} ${LANG==="es"?"violación(es) ya.":"violation(s) already."}`);
  }
  const nr=nearest(d);const conv=(tr(d.conviction)||"").toLowerCase();
  if(sg==="GO"){
    parts.push(`<span class="hl">${sym}: ${LANG==="es"?"hay una entrada preparada.":"there's a setup ready."}</span>`);
    const sa=d.scenarioA||{};
    if(sa.entryZone&&sa.entryZone.length===2){
      parts.push(LANG==="es"
        ?`No entres a lo loco: espera a que el precio llegue a la zona ${N(sa.entryZone[0])}-${N(sa.entryZone[1])} y reaccione ahí${sa.target?`, y apunta a ${N(sa.target)}`:""}. Si no reacciona, no hay trade.`
        :`Don't jump in: wait for price to reach the ${N(sa.entryZone[0])}-${N(sa.entryZone[1])} zone and react there${sa.target?`, aiming for ${N(sa.target)}`:""}. If it doesn't react, there's no trade.`);
    }
  } else if(sg==="AVOID"){
    parts.push(`<span class="hl">${sym}: ${LANG==="es"?"hoy, fuera.":"today, stand down."}</span> ${LANG==="es"?"El plan dice no tocar esto hoy.":"The plan says don't touch this today."}`);
  } else {
    const allWait=SYMS.every(s=>{const v=sig(s);return !v||v==="WAIT"||v==="AVOID";});
    parts.push(allWait
      ?`<span class="hl">${LANG==="es"?"No hay nada que operar todavía.":"There's nothing to trade yet."}</span>`
      :`<span class="hl">${sym}: ${LANG==="es"?"todavía no hay una entrada clara.":"no clear setup yet."}</span>`);
    if(nr&&nr.d>0){
      parts.push(LANG==="es"
        ?`El nivel más cercano que importa está a ${N(Math.round(nr.d))} puntos (${gloss(nr.name)}); hasta que el precio no llegue ahí y reaccione, no hay punto de entrada: entrar en medio es perseguir, no operar.`
        :`The nearest level that matters is ${N(Math.round(nr.d))} points away (${gloss(nr.name)}); until price gets there and reacts, there's no entry: jumping in between is chasing, not trading.`);
    }
  }
  if(edgeLoses()&&sg!=="GO"){
    parts.push(LANG==="es"
      ?`Además, la ventaja medida de este tipo de operación está hoy en negativo: a la larga pierde dinero una vez descontadas las comisiones, así que no es momento de forzar.`
      :`On top of that, the measured edge of this kind of trade is negative today: over time it loses money after costs, so this isn't the moment to force it.`);
  }
  if(conv&&(conv.includes("baj")||conv.includes("low"))){
    parts.push(LANG==="es"?`La confianza del propio plan en esto es baja.`:`The plan's own confidence in this is low.`);
  }
  return parts.join(" ");
}

function drawTerrain(d,symOver){

    .filter(z=>{const k=Math.round(z.lo)+"-"+Math.round(z.hi)+(z.type||"");if(seenZ.has(k))return false;seenZ.add(k);return true;});
  const sa=d.scenarioA||{};const targets=[];if(sa.target)targets.push({price:sa.target,name:LANG==="es"?"objetivo":"target"});if(sa.target2)targets.push({price:sa.target2,name:LANG==="es"?"obj 2":"tgt 2"});

  let price=livePrice(sym);

    if(price==null||Math.abs(price-ref)>((d.expectedMove&&d.expectedMove.high)||300)*2.2)price=ref;}
  if(price==null&&kl.length)price=kl[0].price;
  // scale window around price
  const em=d.expectedMove||{};const near=[...zones.map(z=>Math.abs(((z.lo+z.hi)/2)-price)),...kl.map(k=>Math.abs(k.price-price))].filter(x=>!isNaN(x));
  const half=Math.max((em.high||0)*1.15,((near.length?Math.min(...near):200))*1.7,(em.base||150)*1.2,100);
  // recorrido intradía (velas 5m), ALINEADO a la escala del plan: los niveles vienen de TradingView
  // y las velas de Yahoo, con un desfase de pocos puntos; se corrige para que el final caiga en el
  // precio actual y el trayecto cuadre con los niveles dibujados.
  const bars=barsFor(sym);
  const sh=(bars&&bars.length&&price!=null)?(price-bars[bars.length-1][4]):0;
  let pLo=null,pHi=null;
  if(bars){for(const b of bars){const l=b[3]+sh,h=b[2]+sh;if(pLo==null||l<pLo)pLo=l;if(pHi==null||h>pHi)pHi=h;}}
  let top=price+half,bot=price-half;
  if(pHi!=null){top=Math.max(top,pHi);bot=Math.min(bot,pLo);const pad=(top-bot)*0.07;top+=pad;bot-=pad;}
  const Y=(pp)=>PADT+(top-pp)/(top-bot)*(H-PADT-PADB);
  const clamp=(pp)=>pp>top?top:pp<bot?bot:pp;
  const touched=(p)=>!!(bars&&bars.some(b=>(b[3]+sh)<=p&&p<=(b[2]+sh)));
  const sgc={GO:"--go",WAIT:"--wait",AVOID:"--avoid"}[(d.verdict&&d.verdict.signal)]||"--ember";
  let out=`<defs><linearGradient id="pd" x1="0" y1="0" x2="0" y2="1">

    out+=`<rect x="${x0}" y="${yt}" width="${x1-x0}" height="${Math.max(3,yb-yt)}" fill="rgba(${col},.11)" stroke="rgba(${col},.4)" stroke-width="1"/>`;

  const h=S.health;const hd=document.getElementById("hdot"),ht=document.getElementById("htxt"),sl=document.getElementById("sysline");
  if(!hd||!ht||!sl)return;
  if(!h){hd.className="hdot";ht.textContent="";sl.className="sysline ok";sl.innerHTML="";return;}
  const st=["ok","warn","bad"].includes(h.status)?h.status:"ok";
  hd.className="hdot"+(st==="ok"?"":" "+st);
  ht.textContent=st==="ok"?t("sysok"):st==="warn"?t("syswarn"):t("sysbad");
  const iss=(h.issues||[]);
  if(st==="ok"||!iss.length){sl.className="sysline ok";sl.innerHTML="";return;}
  sl.className="sysline "+st;
  sl.innerHTML=`<span class="k">${t("sysheadw")}</span>${t("syslead")} `
    +iss.map(x=>`<b style="color:var(--fg2)">${gloss(String(x))}</b>`).join(" · ");
}
/* ACT IV — ¿cómo vas hoy? (conducta del Coach, global, al final) */
function renderDisciplina(){
  const box=document.getElementById("disc"),grid=document.getElementById("discGrid"),meta=document.getElementById("discMeta"),rev=document.getElementById("discRev");
  if(!box)return;
  const c=S.coach&&!S.coach.__err?S.coach:null;
  if(!c||!c.sessionBudget){box.hidden=true;return;}
  const es=LANG==="es",sb=c.sessionBudget||{},st=(c.state||"OK").toUpperCase();
  const money=v=>v==null?"·":(v<0?"-$":"$")+Math.abs(Math.round(v)).toLocaleString("en-US");
  const cards=[];
  // estado
  const stMap={LOCKOUT:["EN BLOQUEO","--avoid","rgba(255,106,92,.16)"],TILT:[es?"Cuidado":"Careful","--wait","rgba(232,184,75,.16)"],OK:[es?"Libre":"Clear","--go","rgba(91,212,138,.16)"]};
  const stx=stMap[st]||stMap.OK;
  cards.push(`<div class="pcard"><div class="pk">${es?"Estado":"State"}</div>`+
    `<div class="pbig" style="color:var(${stx[1]});display:flex;align-items:center;gap:11px"><span style="width:11px;height:11px;border-radius:50%;background:var(${stx[1]});box-shadow:0 0 0 4px ${stx[2]};flex:none"></span>${stx[0]}</div>`+
    `<div class="psub">${st==="LOCKOUT"?(es?"El Coach te paró. Hoy el plan es para leer, no para operar.":"The Coach stopped you. Today the plan is to read, not to trade."):st==="TILT"?(es?"Señales de tilt. Baja el tamaño y respira.":"Tilt signs. Cut size and breathe."):(es?"Dentro de tus reglas. Sigue así.":"Within your rules. Keep it up.")}</div></div>`);
  // del día
  const pnl=sb.pnl,pnlR=sb.pnlR,dayStop=sb.dayStop;
  const dCol=pnl==null?"--fg":pnl<=-(dayStop||Infinity)?"--avoid":pnl<0?"--ember":"--go";
  cards.push(`<div class="pcard"><div class="pk">${es?"Del día":"Today"}</div>`+
    `<div class="pbig" style="color:var(${dCol})">${pnlR==null?"·":(pnlR>0?"+":"")+pnlR.toFixed(1)}<small> R</small></div>`+
    `<div class="psub">${money(pnl)}${dayStop?` · ${es?"tope":"limit"} ${money(-dayStop)}`:""}</div></div>`);
  // trades
  const used=sb.used,maxT=sb.maxTrades,over=maxT&&used>maxT?used-maxT:0;
  const tCol=used==null?"--fg":maxT&&used>maxT?"--avoid":maxT&&used===maxT?"--wait":"--fg";
  cards.push(`<div class="pcard"><div class="pk">${es?"Trades":"Trades"}</div>`+
    `<div class="pbig" style="color:var(${tCol})">${used==null?"·":used}<small> / ${maxT||"·"}</small></div>`+
    `<div class="psub">${over>0?(es?`${over} de más. Sobre-operaste.`:`${over} over. You overtraded.`):(es?"Dentro del tope.":"Within the cap.")}</div></div>`);
  // fuera de zona (la fuga)
  if(c.offZone&&c.offZone.ofTrades){const oz=c.offZone,ozCol=oz.count>0?"--avoid":"--go";
    cards.push(`<div class="pcard"><div class="pk">${es?"Fuera de zona":"Out of zone"}</div>`+
      `<div class="pbig" style="color:var(${ozCol})">${oz.count}<small> ${es?"de":"of"} ${oz.ofTrades}</small></div>`+
      `<div class="psub">${oz.count>0?(es?`${money(oz.pnl)} en tierra de nadie. Tu fuga.`:`${money(oz.pnl)} in no-man's-land. Your leak.`):(es?"Todas en nivel. Bien.":"All at a level. Good.")}</div></div>`);}
  // racha
  const stk=c.disciplineStreak;
  cards.push(`<div class="pcard"><div class="pk">${es?"Racha disciplina":"Discipline streak"}</div>`+
    `<div class="pbig" style="color:var(${stk>0?"--go":"--muted"})">${stk==null?"·":stk}<small> ${es?(stk===1?"día":"días"):(stk===1?"day":"days")}</small></div>`+
    `<div class="psub">${!stk?(es?"Se reinició. Un día limpio la reabre.":"Reset. A clean day reopens it."):(es?"Días seguidos siguiendo el plan.":"Days in a row following the plan.")}</div></div>`);
  grid.innerHTML=cards.join("");
  // última autopsia (lastReview)
  const lr=c.lastReview;
  if(lr&&lr.headline){const hd=String(lr.headline).replace(/\*\*/g,"").replace(/^#+\s*/,"");
    rev.style.display="";rev.innerHTML=`<span class="k">${es?"Última autopsia":"Last review"} · ${lr.date||""}</span>${gloss(hd)}`;}
  else{rev.style.display="none";rev.innerHTML="";}
  box.hidden=false;meta.textContent=es?"tus cuentas · hoy":"your accounts · today";
}
function renderAll(){tick();renderHealth();renderSwitch();renderFocus();renderMinds();renderConf();renderDisciplina();syncStatic();}

function setLang(l){LANG=l;document.getElementById("es").setAttribute("aria-pressed",l==="es");
  document.getElementById("en").setAttribute("aria-pressed",l==="en");try{localStorage.setItem("mesa-lang",l)}catch(e){}renderAll();}
document.getElementById("es").onclick=()=>setLang("es");document.getElementById("en").onclick=()=>setLang("en");
try{const sl=localStorage.getItem("mesa-lang");if(sl)LANG=sl;}catch(e){}
document.getElementById("es").setAttribute("aria-pressed",LANG==="es");document.getElementById("en").setAttribute("aria-pressed",LANG==="en");

/* refresco automático: mira el bus cada ~45 s, calcula una firma con los sellos de
   tiempo de cada archivo y SOLO repinta cuando algo cambió de verdad (sin parpadeo
   cuando no hay datos nuevos). Conserva el instrumento que elegiste. */
let LAST_SIG="",LAST_PLAN="",FIRST=true;
function stampOf(o){if(!o||o.__err)return"";for(const f of["_updatedAt","generatedAt","builtAt","checkedAt","lastRun","asOf","updatedAt"]){if(o[f])return String(o[f]);}return"";}
function sigOf(){return [S.plan,S.sa,S.coach,S.market,S.crypto,S.parity,S.health,S.edge,S.bars,S.feeds].map(stampOf).join("|");}
function flashFresh(){const el=document.getElementById("liveTxt");if(!el)return;el.classList.remove("fresh");void el.offsetWidth;el.classList.add("fresh");}
async function loadCal(){const cs=await getJSON(TOS+"/state/contexto-state.json");if(cs&&!cs.__err&&cs.scorecard){S.cal=cs.scorecard;renderConf();}}
async function load(){
  const barsDate=new Date().toISOString().slice(0,10);
  const [plan,sa,coach,market,crypto,parity,health,edge,bars,feeds]=await Promise.all([
    getJSON(TOS+"/live/plan.json"),getJSON(SA+"/plans/latest.json"),getJSON(TOS+"/live/trader.json"),
    getJSON(TOS+"/live/market.json"),getJSON(TOS+"/plans/crypto-latest.json"),getJSON(TOS+"/live/parity.json"),
    getJSON(TOS+"/live/health.json"),getJSON(TOS+"/live/edge.json"),getJSON(TOS+"/bars/"+barsDate+".json"),
    getJSON(TOS+"/live/feeds.json")]);
  S.bars=bars&&!bars.__err?bars:null;S.feeds=feeds&&!feeds.__err?feeds:null;
  let pl=plan;SAMPLE=false;
  if((!pl||pl.__err)&&typeof PLAN_SEED!=="undefined"){pl=PLAN_SEED;SAMPLE=true;}
  let sap=sa;if((!sap||sap.__err)&&typeof SA_SEED!=="undefined")sap=SA_SEED;
  S.plan=pl;S.sa=sap;S.coach=coach;S.market=market;S.crypto=crypto;
  S.parity=parity&&!parity.__err?parity:null;S.health=health&&!health.__err?health:null;S.edge=edge&&!edge.__err?edge:null;
  const sig=sigOf(),ps=stampOf(S.plan);
  if(FIRST){FIRST=false;LAST_SIG=sig;LAST_PLAN=ps;
    if(pl&&pl.cleanest&&pl.instruments&&pl.instruments[pl.cleanest])FOCUS=pl.cleanest;
    renderAll();loadCal();return;}
  if(sig!==LAST_SIG){LAST_SIG=sig;renderAll();flashFresh();
    if(ps&&ps!==LAST_PLAN){LAST_PLAN=ps;loadCal();}}
}
syncStatic();load();
setInterval(tick,30000);
setInterval(load,45000);
</script>
