<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TDL Command · Briefing</title>
<meta name="theme-color" content="#080b0f">
<link rel="icon" href="/td-logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
/* Command Center v3 · briefing. Hero de veredicto, columna principal (tesis, ideas, mapa a escala) y lateral (historia, qué esperar, checklist, otros).
   Identidad TradeDadLog (design-system/tradedadlog/MASTER.md): dorado sobre casi negro. */
:root{
  --ground:#080b0f; --panel:#0e1319; --panel2:#131a22; --line:rgba(255,255,255,.07); --line2:rgba(255,255,255,.12);
  --ink:#ece7dc; --ink2:#c9c3b6; --mute:#8a929f; --faint:#56606e;
  --gold:#c79235; --gold2:#e6b964; --goldbg:rgba(199,146,53,.08);
  --up:#41b97f; --down:#e3655e; --warn:#dca744;
  --display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --sans:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--ground);color:var(--ink);font:15px/1.55 var(--sans);-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(1200px 500px at 15% -10%,rgba(199,146,53,.10),transparent 60%),radial-gradient(rgba(255,255,255,.035) 1px,transparent 1px);
  background-size:auto,24px 24px;background-attachment:fixed;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 56px}
[hidden]{display:none!important}
.wrap{max-width:1360px;margin:0 auto}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.lbl{font:600 11px/1.3 var(--display);font-stretch:85%;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.up{color:var(--up)}.down{color:var(--down)}.warn{color:var(--warn)}.gold{color:var(--gold2)}
a{color:var(--gold2)}

.sec{background:linear-gradient(180deg,rgba(255,255,255,.018),transparent 120px),var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px 22px 22px;display:flex;flex-direction:column;gap:16px;min-width:0;box-shadow:inset 0 1px 0 rgba(255,255,255,.04),0 20px 40px -30px rgba(0,0,0,.8)}
.hd{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding-bottom:12px;border-bottom:1px solid var(--line)}
h2{margin:0;font:800 15px/1 var(--display);font-stretch:78%;letter-spacing:.16em;text-transform:uppercase;color:var(--ink);display:flex;align-items:center;gap:10px}
h2::before{content:"";width:8px;height:8px;background:var(--gold);transform:rotate(45deg);flex:none}
.src{font:500 11px var(--mono);color:var(--faint)}

body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--ground)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:rgba(8,11,15,.86);backdrop-filter:blur(12px) saturate(140%);-webkit-backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);padding:12px 0;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font:900 18px/1 var(--display);font-stretch:72%;letter-spacing:.12em;color:var(--ink);text-decoration:none}
.brand small{font:500 10px var(--mono);letter-spacing:.1em;color:var(--faint);display:block;margin-top:3px}
.seg{display:flex;gap:2px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:3px}
.sym,.lng{font:700 13px var(--mono);background:none;border:0;color:var(--mute);border-radius:6px;padding:7px 12px;cursor:pointer;display:flex;gap:8px;align-items:center;transition:color .15s,background .15s}
.lng{padding:6px 9px;font-size:11px}
.sym:hover,.lng:hover{color:var(--ink)}
.sym[aria-pressed="true"],.lng[aria-pressed="true"]{background:var(--panel2);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line2)}
button:focus-visible,a:focus-visible{outline:2px solid var(--gold2);outline-offset:2px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--faint);flex:none}
.dot.WAIT{background:var(--warn)}.dot.GO{background:var(--up)}.dot.AVOID{background:var(--down)}
.topr{margin-left:auto;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.clock{font:500 13px var(--mono);color:var(--ink2)}
.mk{font:700 11px var(--mono);letter-spacing:.06em;padding:5px 9px;border-radius:6px;display:flex;gap:7px;align-items:center}
.mk::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.mk.open{background:rgba(65,185,127,.1);color:var(--up)}.mk.halt{background:rgba(220,167,68,.1);color:var(--warn)}.mk.closed{background:rgba(227,101,94,.1);color:var(--down)}
.old{color:var(--faint);font:500 11px var(--mono);text-decoration:none;border:1px solid var(--line);border-radius:6px;padding:5px 8px}
.old:hover{color:var(--ink2)}

.now{margin-top:22px;display:grid;grid-template-columns:280px minmax(0,1fr);border:1px solid rgba(199,146,53,.28);border-radius:14px;overflow:hidden;
  background:linear-gradient(110deg,rgba(199,146,53,.10),rgba(199,146,53,.02) 45%,transparent),var(--panel);box-shadow:0 30px 60px -40px rgba(199,146,53,.35),inset 0 1px 0 rgba(255,255,255,.05)}
.vbox{padding:26px 24px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:14px;position:relative;background:rgba(0,0,0,.18)}
.vbox::after{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--vc,var(--faint))}
.vword{font:900 52px/.9 var(--display);font-stretch:68%;letter-spacing:.02em;color:var(--vc,var(--mute))}
.vsym{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.vsym b{font:800 22px var(--display);font-stretch:80%;letter-spacing:.06em}
.vpx{font:700 30px/1 var(--mono);letter-spacing:-.02em}
.vday{font-size:13px;color:var(--mute)}
.meter{display:flex;gap:3px}
.meter i{flex:1;height:5px;border-radius:2px;background:var(--line2)}
.vwhy{font-size:12.5px;color:var(--mute);line-height:1.45}
.nbody{padding:26px 28px;display:flex;flex-direction:column;gap:14px;min-width:0}
.live{display:flex;align-items:baseline;gap:8px;font:600 11px var(--mono);letter-spacing:.08em;color:var(--mute)}
.live i{width:7px;height:7px;border-radius:50%;background:var(--gold2);flex:none;transform:translateY(-1px)}
.live.stale i{background:var(--down)}
@media (prefers-reduced-motion:no-preference){.live:not(.stale) i{animation:pulse 2s infinite}@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(230,185,100,.5)}70%{box-shadow:0 0 0 7px rgba(230,185,100,0)}100%{box-shadow:0 0 0 0 rgba(230,185,100,0)}}}
.head{font:700 clamp(24px,2.7vw,34px)/1.18 var(--display);font-stretch:88%;margin:0;text-wrap:balance;max-width:32ch}
.head em{font-style:normal;color:var(--gold2)}
.todo{font-size:16.5px;color:var(--ink2);max-width:66ch;margin:0;padding-left:14px;border-left:2px solid var(--gold)}
.facts{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));margin-top:4px;border-top:1px solid var(--line);padding-top:14px}
.fact{display:grid;gap:3px;min-width:0;padding:0 14px;border-left:1px solid var(--line)}
.fact:first-child{padding-left:0;border-left:0}
.fact .v{font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fact .s{font-size:12px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.grid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:20px;margin-top:20px;align-items:start}
.col{display:grid;gap:20px;min-width:0}

.thmain{margin:0;font-size:17px;line-height:1.6;color:var(--ink);max-width:68ch}
.scen{display:grid;gap:8px}
.sc{display:grid;grid-template-columns:28px minmax(0,1fr);gap:12px;align-items:start;font-size:14px;color:var(--ink2)}
.sc b{font:800 12px/24px var(--display);font-stretch:80%;text-align:center;border-radius:6px;background:var(--panel2);border:1px solid var(--line2);color:var(--gold2)}
.sc small{display:block;color:var(--mute);font-size:13px;margin-top:2px}
.tri{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tri div{border:1px solid var(--line);border-radius:9px;padding:12px 14px;font-size:14px;color:var(--ink2);display:grid;gap:4px;align-content:start}
.tri div:last-child{border-color:rgba(227,101,94,.25);background:rgba(227,101,94,.04)}

.ideas{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.idea{border:1px solid var(--line);border-radius:11px;background:var(--panel2);overflow:hidden;display:flex;flex-direction:column}
.idea .t{display:flex;gap:12px;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}
.idea .ic{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;font-size:15px;flex:none}
.idea.short .ic{background:rgba(227,101,94,.12);color:var(--down)}.idea.long .ic{background:rgba(65,185,127,.12);color:var(--up)}
.idea .tt{font:700 17px/1.2 var(--display);font-stretch:88%}
.tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px}
.tag{font:700 10px var(--mono);letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:4px;background:var(--line);color:var(--mute)}
.tag.fav{background:rgba(65,185,127,.12);color:var(--up)}.tag.contra{background:rgba(220,167,68,.12);color:var(--warn)}.tag.dist{background:var(--goldbg);color:var(--gold2)}
.idea dl{margin:0;display:grid;grid-template-columns:82px minmax(0,1fr);font-size:14px}
.idea dt,.idea dd{padding:9px 0;border-bottom:1px solid var(--line)}
.idea dt{padding-left:16px;font:600 10.5px/1.9 var(--display);font-stretch:85%;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.idea dd{margin:0;padding-right:16px;color:var(--ink2)}
.idea dl>*:nth-last-child(-n+2){border-bottom:0}
.idea dd.tg{color:#8fdcb4}.idea dd.iv{color:#f0a19c}
.idea.empty{padding:18px;color:var(--mute);font-size:14px;grid-column:1/-1}
.avoid{border-radius:11px;padding:14px 18px;background:repeating-linear-gradient(135deg,rgba(227,101,94,.05) 0 10px,transparent 10px 20px),rgba(227,101,94,.03);border:1px solid rgba(227,101,94,.22)}
.avoid b{font:800 13px var(--display);font-stretch:80%;letter-spacing:.14em;text-transform:uppercase;color:var(--down)}
.avoid ul{margin:8px 0 0;padding:0;list-style:none;display:grid;gap:6px;font-size:14px;color:var(--ink2)}
.avoid li{display:grid;grid-template-columns:16px 1fr;gap:6px}
.avoid li::before{content:"✕";color:var(--down);font-size:11px;padding-top:3px}
.note{font-size:12.5px;color:var(--faint);margin:0;max-width:72ch}

.map{position:relative;min-height:120px}
.map svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.lv{position:absolute;left:118px;right:0;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 14px;padding:7px 12px;border-radius:8px;border:1px solid transparent}
.lv .n{font:800 14px var(--display);font-stretch:85%;letter-spacing:.04em;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.lv .n small{font:400 12px var(--sans);letter-spacing:0;color:var(--faint)}
.lv .pd{text-align:right;white-space:nowrap}
.lv .p{font:500 13px var(--mono);color:var(--ink2)}
.lv .d{font:700 11px var(--mono);color:var(--mute);margin-left:8px}
.lv .m{grid-column:1/-1;font-size:13px;color:var(--mute);line-height:1.45}
.lv.res .n{color:#f0918b}.lv.sup .n{color:#7fd6a8}.lv.zone .n{color:var(--ink2)}.lv.ntz .n{color:#f0918b}.lv.plan .n{color:var(--gold2)}
.lv.near{background:var(--goldbg);border-color:rgba(199,146,53,.25)}
.lv.near .d{color:var(--gold2)}
.lv.px{background:linear-gradient(90deg,rgba(199,146,53,.2),rgba(199,146,53,.04));border-color:rgba(199,146,53,.45)}
.lv.px .n{color:var(--gold2)}.lv.px .p{color:var(--ink);font-weight:700}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--mute)}
.legend span{display:flex;gap:6px;align-items:center}
.legend i{width:10px;height:3px;border-radius:2px}

.tl{list-style:none;margin:0;padding:0;position:relative}
.tl::before{content:"";position:absolute;left:57px;top:8px;bottom:8px;width:1px;background:var(--line2)}
.tl li{display:grid;grid-template-columns:44px minmax(0,1fr);gap:26px;padding:8px 0;font-size:14px;color:var(--ink2);position:relative}
.tl li::before{content:"";position:absolute;left:54px;top:15px;width:7px;height:7px;border-radius:50%;background:var(--panel);border:1.5px solid var(--faint)}
.tl li.ev::before{border-color:var(--gold)}
.tl li.new{color:var(--ink)}
.tl li.new::before{background:var(--gold2);border-color:var(--gold2);box-shadow:0 0 0 4px rgba(199,146,53,.18)}
.tl time{font:700 11px var(--mono);color:var(--mute);padding-top:3px;text-align:right;letter-spacing:.04em}
.tl li.new time{color:var(--gold2)}
.tl .empty{color:var(--faint);font-size:13px}

.sess{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.ss{border:1px solid var(--line);border-radius:8px;padding:9px 11px;font-size:12.5px;color:var(--mute);display:grid;gap:2px}
.ss b{font:800 12px var(--display);font-stretch:80%;letter-spacing:.12em;color:var(--ink2)}
.ss.on{border-color:rgba(199,146,53,.5);background:var(--goldbg)}.ss.on b{color:var(--gold2)}
.adr{display:grid;gap:8px}
.adrh{display:flex;justify-content:space-between;align-items:baseline}
.adrh .num{font-size:22px;font-weight:700}
.bar{height:10px;background:var(--panel2);border-radius:6px;position:relative;border:1px solid var(--line);margin-top:14px}
.bar i{position:absolute;inset:0 auto 0 0;border-radius:6px;background:linear-gradient(90deg,#6d5222,var(--gold) 55%,var(--down))}
.bar u{position:absolute;top:-5px;bottom:-5px;width:2px;background:var(--ink);left:66.66%}
.bar u::after{content:"100 %";position:absolute;top:-17px;left:-14px;font:600 10px var(--mono);color:var(--mute)}
.ev2{display:grid;grid-template-columns:76px minmax(0,1fr);gap:12px;font-size:14px;padding:8px 0;border-top:1px solid var(--line);color:var(--ink2)}
.ev2 span{font:700 12px var(--mono);color:var(--warn);padding-top:1px}
.ev2.hi span{color:var(--down)}
.pred{display:grid;grid-template-columns:38px minmax(0,1fr);gap:10px;font-size:13.5px;padding:7px 0;border-top:1px solid var(--line);color:var(--ink2)}
.pred span{font:700 12px var(--mono);color:var(--gold2)}
.pred small{display:block;color:var(--faint);font-size:12px}

.chks{display:grid;gap:2px}
.chk{display:flex;gap:12px;align-items:flex-start;background:none;border:0;border-radius:8px;color:var(--ink2);font:inherit;font-size:14px;text-align:left;padding:8px;margin:0 -8px;cursor:pointer;transition:background .15s}
.chk:hover{background:rgba(255,255,255,.03)}
.chk i{flex:none;width:20px;height:20px;border:1.5px solid var(--faint);border-radius:5px;margin-top:1px;display:grid;place-items:center;font:700 12px var(--sans);font-style:normal;color:transparent;transition:all .15s}
.chk[aria-pressed="true"] i{background:var(--gold);border-color:var(--gold);color:var(--ground)}
.chk[aria-pressed="true"] span{color:var(--mute);text-decoration:line-through;text-decoration-color:var(--faint)}
.segs{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.segs i{height:4px;border-radius:2px;background:var(--line2);transition:background .2s}
.segs i.on{background:var(--gold)}
.segs.ok i{background:var(--up)}
.gate{font:700 12px var(--mono);letter-spacing:.04em;color:var(--mute)}
.gate.ok{color:var(--up)}
.reset{background:none;border:0;color:var(--faint);font:500 11px var(--mono);cursor:pointer;padding:0;justify-self:start}
.reset:hover{color:var(--ink2)}

.ot{display:grid;grid-template-columns:48px 96px minmax(0,1fr) 14px;gap:10px;align-items:center;padding:10px 8px;margin:0 -8px;border:0;border-radius:8px;width:calc(100% + 16px);font:inherit;font-size:13.5px;color:var(--ink2);text-align:left;cursor:pointer;background:none}
.ot+.ot{border-top:1px solid var(--line)}
.ot:hover{background:rgba(255,255,255,.03)}
.ot b{font:700 13px var(--mono);color:var(--ink)}
.ot em{font-style:normal;color:var(--faint)}
.st{font:700 10px var(--mono);letter-spacing:.06em;display:flex;gap:6px;align-items:center}
.st.WAIT{color:var(--warn)}.st.GO{color:var(--up)}.st.AVOID{color:var(--down)}.st.NODATA{color:var(--faint)}

.foot{margin-top:24px;padding-top:14px;border-top:1px solid var(--line);font:500 11px var(--mono);color:var(--faint);display:flex;gap:20px;flex-wrap:wrap}
.foot .bad{color:var(--down)}
.loading{opacity:.45}

@media (max-width:1040px){.grid{grid-template-columns:minmax(0,1fr)}}
@media (max-width:820px){.now{grid-template-columns:minmax(0,1fr)}.vbox{border-right:0;border-bottom:1px solid var(--line)}
  .vbox::after{width:auto;right:0;bottom:auto;height:3px}
  .facts{grid-template-columns:repeat(2,minmax(0,1fr));row-gap:14px}.fact{padding:0 12px}.fact:nth-child(odd){padding-left:0;border-left:0}}
@media (max-width:620px){.ideas,.tri{grid-template-columns:minmax(0,1fr)}.nbody,.vbox{padding:20px}.vword{font-size:42px}.sec{padding:18px 16px 20px}
  .lv{left:50px;grid-template-columns:minmax(0,1fr);padding:6px 10px}.lv .pd{text-align:left}.lv .n small{display:none}.topr{margin-left:0}.ot{grid-template-columns:42px 86px minmax(0,1fr)}.ot em{display:none}.clock{display:none}}
</style>
</head>
<body>
<div class="wrap" id="app">
  <header class="top">
    <a class="brand" href="/command-center-v3.html">
      <svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><rect x="1" y="1" width="24" height="24" rx="6" fill="none" stroke="#c79235" stroke-width="1.5"/><path d="M6 16 L11 11 L15 14 L20 8" fill="none" stroke="#e6b964" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="20" cy="8" r="2" fill="#e6b964"/></svg>
      <div>TDL COMMAND<small>BRIEFING · v3</small></div>
    </a>
    <nav class="seg" id="syms" aria-label="Market"></nav>
    <div class="topr">
      <span class="clock num" id="clock"></span>
      <span class="mk" id="mk"></span>
      <div class="seg" role="group" aria-label="Language"><button class="lng" data-l="en">EN</button><button class="lng" data-l="es">ES</button></div>
      <a class="old" href="/command-center.html" id="oldLink"></a>
    </div>
  </header>

  <section class="now" aria-labelledby="nowH">
    <div class="vbox" id="vbox">
      <span class="lbl" data-t="Veredicto|Verdict"></span>
      <div class="vword" id="vWord">···</div>
      <div><div class="vsym"><b id="vSym"></b><span class="vpx num" id="vPx"></span></div><div class="vday" id="vDay"></div></div>
      <div><span class="lbl" style="display:block;margin-bottom:6px" data-t="Fuerza de la tendencia|Trend strength"></span><div class="meter" id="meter"></div></div>
      <div class="vwhy" id="vWhy"></div>
    </div>
    <div class="nbody">
      <div class="live" id="live"><i></i><span id="liveT"></span></div>
      <h1 class="head" id="nowH"></h1>
      <p class="todo" id="nowTodo"></p>
      <div class="facts" id="facts"></div>
    </div>
  </section>

  <div class="grid">
    <div class="col">
      <section class="sec">
        <div class="hd"><h2 data-t="La tesis de hoy|Today's thesis"></h2><span class="src" id="thSrc"></span></div>
        <p class="thmain" id="thMain"></p>
        <div class="scen" id="scen"></div>
        <div class="tri">
          <div><span class="lbl" data-t="Si me equivoco|If I'm wrong"></span><span id="thContra"></span></div>
          <div><span class="lbl down" data-t="Se rompe la tesis|Thesis breaks"></span><span id="thInv"></span></div>
        </div>
      </section>

      <section class="sec">
        <div class="hd"><h2 data-t="Ideas de trade|Trade ideas"></h2><span class="src" data-t="plan con condiciones · no es una señal|a plan with conditions · not a signal"></span></div>
        <div class="ideas" id="ideas"></div>

<script>
(function(){
'use strict';
/* ---------------- config ---------------- */
var API=/(^|\.)tradedadlog\.com$/i.test(location.hostname)?'':'https://tradedadlog.com';
var BUS='https://raw.githubusercontent.com/jesusreyna2016/session-analyst-bus/main/plans/';
var SYMS={
  NQ:{src:'symbols',key:'NQ',tick:.25,nml:100,plan:'fut',dec:2},
  ES:{src:'symbols',key:'ES',tick:.25,nml:40,plan:'fut',dec:2},
  GC:{src:'symbols',key:'GC',tick:.1,nml:60,plan:'fut',dec:1},
  YM:{src:'symbols',key:'YM',tick:1,nml:50,plan:'fut',dec:0},
  ETH:{src:'crypto',key:'ETHUSDT',tick:.01,nml:160,plan:'cry',dec:2,crypto:true}
};
var ORDER=['NQ','ES','GC','YM','ETH'];
var FEED=null,PF=null,PC=null,NEWS=null,ERR={},LAST={feed:0,plan:0};

/* ---------------- utils ---------------- */
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}
var LANG=ls('cc_lang')==='es'?'es':'en';
var SYM=ls('cc3_sym');if(!SYMS[SYM])SYM='NQ';
function T(es,en){return LANG==='es'?es:en}
function L(x){if(x==null)return '';if(typeof x==='string')return x;return x[LANG]||x.en||x.es||''}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function $(id){return document.getElementById(id)}
function num(v){var n=parseFloat(v);return isFinite(n)?n:null}
function fmt(v,s){if(v==null||!isFinite(v))return '·';var d=SYMS[s||SYM].dec;var x=Math.abs(v).toFixed(d).split('.');x[0]=x[0].replace(/\B(?=(\d{3})+(?!\d))/g,LANG==='es'?' ':',');return (v<0?'-':'')+x.join('.')}
function ago(ts){if(!ts)return '·';var m=Math.round((Date.now()-ts)/60000);if(m<1)return T('ahora','now');if(m<60)return m+' min';var h=Math.round(m/60);return h<48?h+' h':Math.round(h/24)+' d'}
function ct(d){var p={};new Intl.DateTimeFormat('en-US',{timeZone:'America/Chicago',weekday:'short',hour:'2-digit',minute:'2-digit',hour12:false,month:'short',day:'numeric'}).formatToParts(d||new Date()).forEach(function(x){p[x.type]=x.value});var h=+p.hour%24;return{wd:p.weekday,h:h,m:+p.minute,mins:h*60+(+p.minute),day:p.day,mon:p.month}}
function hhmm(ts){var c=ct(new Date(ts));return String(c.h).padStart(2,'0')+':'+String(c.m).padStart(2,'0')}
function todayKey(){var c=ct();return c.mon+c.day}
var DIR={SHORT:['bajista','bearish','down','▼'],LONG:['alcista','bullish','up','▲'],NEUTRAL:['sin dirección','no direction','warn','·']};
function dirOf(b){return DIR[b]||DIR.NEUTRAL}
var VW={WAIT:['ESPERA','WAIT','var(--warn)'],GO:['ADELANTE','GO','var(--up)'],AVOID:['NO OPERAR','STAND ASIDE','var(--down)'],NODATA:['SIN DATOS','NO DATA','var(--faint)']};
function vword(v){var x=VW[v]||VW.NODATA;return T(x[0],x[1])}

/* ---------------- mercado y sesiones ---------------- */
function market(){
  var c=ct(),wd=c.wd,m=c.mins;
  if(wd==='Sat'||(wd==='Fri'&&m>=960)||(wd==='Sun'&&m<1020))return{st:'closed',t:T('FUTUROS CERRADOS · abren dom 17:00 CT','FUTURES CLOSED · open Sun 17:00 CT')};
  if(m>=960&&m<1020)return{st:'halt',t:T('PARÓN · reabre 17:00 CT','HALT · reopens 17:00 CT')};
  return{st:'open',t:T('MERCADO ABIERTO','MARKET OPEN')};
}
var SESS=[['ASIA','ASIA',1020,120],['LONDRES','LONDON',120,420],['NY','NY',510,900]];
function sessNow(){var m=ct().mins;for(var i=0;i<SESS.length;i++){var s=SESS[i];if(s[2]<s[3]?(m>=s[2]&&m<s[3]):(m>=s[2]||m<s[3]))return i}return -1}
function sessNext(){var m=ct().mins,best=-1,bd=1e9;SESS.forEach(function(s,i){var d=(s[2]-m+1440)%1440;if(d<bd){bd=d;best=i}});return{i:best,min:bd}}

/* ---------------- modelo por mercado ---------------- */
var LV={vah:['VAH','techo del valor de ayer','top of yesterday\'s value'],poc:['POC','precio más negociado ayer','yesterday\'s most traded price'],val:['VAL','suelo del valor de ayer','bottom of yesterday\'s value'],
  dvah:['dVAH','techo del valor de hoy','top of today\'s value'],dpoc:['dPOC','precio más negociado hoy','today\'s most traded price'],dval:['dVAL','suelo del valor de hoy','bottom of today\'s value'],
  vwap:['VWAP','precio medio del día','the day\'s average price'],pdh:['PDH','máximo de ayer','yesterday\'s high'],pdl:['PDL','mínimo de ayer','yesterday\'s low'],
  dayOpen:['DO','apertura del día','day open'],tdo:['TDO','apertura real, 00:00 NY','true day open, 00:00 NY'],orH:['ORH','máximo de la apertura de NY','NY opening range high'],orL:['ORL','mínimo de la apertura de NY','NY opening range low'],
  pwh:['PWH','máximo de la semana pasada','last week\'s high'],pwl:['PWL','mínimo de la semana pasada','last week\'s low'],
  onh:['ONH','máximo overnight','overnight high'],onl:['ONL','mínimo overnight','overnight low'],ibh:['IBH','máximo de la 1ª hora de NY','NY first-hour high'],ibl:['IBL','mínimo de la 1ª hora de NY','NY first-hour low'],
  hod:['HOD','máximo de hoy','today\'s high'],lod:['LOD','mínimo de hoy','today\'s low'],ema200:['EMA200','media de 200 en 5m','5m 200 EMA']};

function model(s){
  var cf=SYMS[s],box=FEED&&FEED[cf.src]&&FEED[cf.src][cf.key];
  if(!box||!box.orb||!box.orb.levels)return{ok:false,sym:s};
  var o=box.orb,f=(box.feed&&box.feed.raw)||{},rg=(box.regime&&box.regime.raw)||{},tc=(box.trendcl&&box.trendcl.raw)||{};
  var price=num(f.close)||o.price,lv={};
  Object.keys(o.levels).forEach(function(k){if(LV[k]&&num(o.levels[k])!=null)lv[k]=num(o.levels[k])});
  ['onh','onl','ibh','ibl','hod','lod','ema200'].forEach(function(k){var v=num(f[k]);if(v!=null)lv[k]=v});
  if(num(f.vwap)!=null)lv.vwap=num(f.vwap);
  var fvgs=[];String(f.fvg||'').split(';').forEach(function(x){var p=x.split(':');if(p.length<3)return;var a=num(p[1]),b=num(p[2]);if(a==null||b==null)return;
    var tf=p[0].split(' ')[0],kd=p[0].split(' ')[1]||'';fvgs.push({tf:tf,kind:kd,lo:Math.min(a,b),hi:Math.max(a,b)})});
  var upd=Math.max(Date.parse(o.updatedAt||0)||0,Date.parse(box.feed&&box.feed.receivedAt||0)||0,num(f.t)||0);
  var m={ok:true,sym:s,cf:cf,price:price,bias:o.biasDir||'NEUTRAL',weekly:o.weeklyDir||'NEUTRAL',dayType:o.dayType||'',regimeO:o.regime||'',struct:o.struct||'',htf:o.htf1||'',
    rg:rg.regime||'',chop:num(f.chopIdx),tcl:num(tc.v),tclFlip:num(tc.flip),tclNext:tc.next||'',lv:lv,fvgs:fvgs,ntz:o.noTradeZone||null,inNtz:!!o.inNtz,
    adr:{pct:num(f.rangePct),range:num(f.rangeToday),atr:num(f.atrD),rem:num(f.remPts),state:f.emRegime||''},
    ses:{asH:num(f.asH),asL:num(f.asL),loH:num(f.loH),loL:num(f.loL),ibh:num(f.ibh),ibl:num(f.ibl),ibBrk:f.ibBrk||'',hod:num(f.hod),lod:num(f.lod),onh:num(f.onh),onl:num(f.onl)},
    sweep:f.sweep||'',sweepAgo:num(f.sweepAgo),barT:num(f.t),upd:upd,gz:f.gzLong||'',stretch:num(f.stretchAtr)};
  // nivel más cercano (sin EMA)
  var best=null;Object.keys(lv).forEach(function(k){if(k==='ema200')return;var dt=Math.round((lv[k]-price)/cf.tick);if(!best||Math.abs(dt)<Math.abs(best.dt))best={k:k,dt:dt,p:lv[k]}});
  m.near=best;m.far=m.inNtz||!best||Math.abs(best.dt)>cf.nml;
  m.plan=planOf(s,m);
  m.verdict=m.plan.fresh&&m.plan.verdict?m.plan.verdict:liveVerdict(m);
  return m;
}
function liveVerdict(m){if(m.rg==='CHOP'&&m.far)return 'AVOID';return 'WAIT'}

function planOf(s,m){
  var cf=SYMS[s],P=cf.plan==='fut'?PF:PC,ins=P&&P.instruments&&P.instruments[cf.key];
  var out={ok:false,fresh:false};
  if(!ins)return out;
  var gen=Date.parse(P.generatedAt||P.builtAt||0)||0,valid=P.validUntil?(Date.parse(P.validUntil)||0):0;
  out.ok=true;out.gen=gen;out.run=P.runType||'';
  // el plan vale hasta su validUntil; si no trae, 30 h, o 72 h con los futuros cerrados (el plan del viernes es el de la Asia del domingo)
  var age=Date.now()-gen;
  out.fresh=valid?Date.now()<valid+3*3600e3:(age<30*3600e3||(!cf.crypto&&market().st!=='open'&&age<72*3600e3));
  out.verdict=ins.verdict&&ins.verdict.signal;out.reason=L(ins.verdict&&ins.verdict.reason);
  out.thesis=cf.plan==='fut'?L(P.dayThesis&&P.dayThesis[cf.key])||L(ins.context):L(ins.context);
  out.context=L(ins.context);out.contra=L(ins.counterCase);
  out.inv=ins.invalidation?L(ins.invalidation.text):'';
  out.scen=[];
  if(ins.scenarioA)out.scen.push({k:'A',t:L(ins.scenarioA.text),g:L(ins.scenarioA.trigger)});
  if(ins.scenarioB)out.scen.push({k:'B',t:L(ins.scenarioB.text),g:L(ins.scenarioB.trigger)});
  out.zones=(ins.zones||[]).map(function(z){var pl=z.play||{};
    var tgt=pl.scale?L(pl.scale):[pl.tp1,pl.tp2].filter(function(x){return x!=null}).map(function(x){return fmt(+x,s)}).join(' → ');
    var inv=pl.ifWrong?L(pl.ifWrong):(pl.structStop?L(pl.structStop):(pl.stop!=null?T('stop en ','stop at ')+fmt(+pl.stop,s):''));
    return{dir:z.dir,lo:Math.min(z.range[0],z.range[1]),hi:Math.max(z.range[0],z.range[1]),type:z.type||'',grade:z.grade||'',fav:z.tcl==='favor'||(!z.tcl&&z.vs24h==='with'),
      win:pl.window||'',trig:L(pl.trigger),tgt:tgt,inv:inv,why:L(z.why)}});
  out.pred=(ins.predictions||[]).slice(0,4).map(function(p){return{t:L(p.text),when:p.resolveAt||'',prob:p.prob}});
  out.exp=ins.expectedMove||null;
  out.personal=P.personal?L(P.personal.note):'';
  out.cal=P.calendarContext?L(P.calendarContext.note):'';out.newsNote=P.newsRisk?L(P.newsRisk.note):'';
  out.alarm=P.alarm?L(P.alarm):'';out.focus=P.focus&&(P.focus.sym===cf.key||P.focus.sym===s);
  return out;
}

/* ---------------- narración ---------------- */
var REG={BULL:['en tendencia alcista','in an uptrend'],BEAR:['en tendencia bajista','in a downtrend'],CHOP:['en chop','chopping'],TRANS:['en transición','in transition']};
function regTxt(m){var r=REG[m.rg]||(m.regimeO.indexOf('Trans')===0?REG.TRANS:null);return r?T(r[0],r[1]):T('sin régimen claro','no clear regime')}
function dtx(dt,signed,s){var c=SYMS[s||SYM],sg=signed&&dt>0?'+':'';return c.crypto?sg+(dt<0?'-':'')+'$'+fmt(Math.abs(dt*c.tick),s||SYM):sg+dt+'t'}
function lvName(k){return LV[k]?LV[k][0]:k}
function lvDesc(k){return LV[k]?T(LV[k][1],LV[k][2]):''}
function headline(m){
  var d=dirOf(m.bias),vw=m.lv.vwap,side=vw==null?'':(m.price<vw?T(' y debajo del VWAP',', below VWAP'):T(' y encima del VWAP',', above VWAP'));
  var h=m.sym+' <em>'+T(d[0],d[1])+(d[3]!=='·'?' '+d[3]:'')+'</em>, '+regTxt(m)+side+'. ';
  if(m.far)h+=T('Está en <em>tierra de nadie</em>, lejos de todo borde.','It is in <em>no-man\'s land</em>, away from every edge.');
  else h+=T('Está a <em>'+dtx(Math.abs(m.near.dt))+' de '+lvName(m.near.k)+'</em>: zona de decisión.','It is <em>'+dtx(Math.abs(m.near.dt))+' from '+lvName(m.near.k)+'</em>: decision zone.');
  return h;
}
function todo(m){
  var mk=market();
  if(!SYMS[m.sym].crypto&&mk.st!=='open')return T('El mercado está cerrado. Lee la tesis y deja las alertas puestas en los bordes del mapa antes de la reapertura.','The market is closed. Read the thesis and set alerts on the map edges before the reopen.');
  if(m.verdict==='AVOID')return T('Hoy este mercado no da nada claro. Cierra el gráfico o mira otro.','This market offers nothing clear today. Close the chart or look at another one.');
  if(m.far)return T('No hay nada que hacer aquí. Pon alertas en los bordes del mapa y espera a que el precio llegue.','Nothing to do here. Set alerts on the map edges and wait for price to get there.');
  var z=inZone(m);
  if(z)return T('El precio está en la zona del plan ('+fmt(z.lo)+' a '+fmt(z.hi)+'). Mira el gatillo de la idea y espera la vela de 5m cerrada.','Price is inside the plan zone ('+fmt(z.lo)+' to '+fmt(z.hi)+'). Check the idea\'s trigger and wait for the closed 5m candle.');
  return T('Mira cómo reacciona en '+lvName(m.near.k)+' ('+lvDesc(m.near.k)+'). Solo actúa con una vela de 5m cerrada, a favor del sesgo.','Watch how it reacts at '+lvName(m.near.k)+' ('+lvDesc(m.near.k)+'). Act only on a closed 5m candle, with the bias.');
}
function inZone(m){var r=null;(m.plan.zones||[]).forEach(function(z){if(m.price>=z.lo-m.cf.tick*8&&m.price<=z.hi+m.cf.tick*8)r=z});return r}
function strength(m){var s=Math.abs(m.tcl||0);if(m.bias!=='NEUTRAL'&&m.bias===m.weekly)s++;if(/alineado/i.test(m.htf))s++;if(m.rg==='BULL'||m.rg==='BEAR')s++;return Math.min(5,s)}
function meaning(m,above){
  var b=m.bias;
  if(above)return b==='SHORT'?T('Resistencia a favor del sesgo. Si llega y rechaza con cierre de 5m, zona de corto.','Resistance with the bias. If it gets there and rejects on a 5m close, short zone.'):
    b==='LONG'?T('Objetivo de los largos. Ahí se toma ganancia, no se persigue.','Target for longs. Take profit there, don\'t chase.'):T('Resistencia. Sin sesgo: solo mirar la reacción.','Resistance. No bias: just watch the reaction.');
  return b==='SHORT'?T('Objetivo de los cortos. Un largo aquí va contra el sesgo: solo con CISD ▲.','Target for shorts. A long here is against the bias: only with a CISD ▲.'):
    b==='LONG'?T('Soporte a favor del sesgo. Si barre y recupera, zona de largo.','Support with the bias. If it sweeps and reclaims, long zone.'):T('Soporte. Sin sesgo: solo mirar la reacción.','Support. No bias: just watch the reaction.');
}

/* ---------------- render ---------------- */
function render(){
  document.documentElement.lang=LANG;
  document.querySelectorAll('[data-t]').forEach(function(e){var p=e.getAttribute('data-t').split('|');e.textContent=T(p[0],p[1])});
  document.querySelectorAll('.lng').forEach(function(b){b.setAttribute('aria-pressed',b.dataset.l===LANG)});
  $('oldLink').textContent=T('versión clásica','classic view');
  topbar();
  var M={};ORDER.forEach(function(s){M[s]=model(s)});
  $('syms').innerHTML=ORDER.map(function(s){return '<button class="sym" data-s="'+s+'" aria-pressed="'+(s===SYM)+'"><span class="dot '+(M[s].ok?M[s].verdict:'')+'"></span>'+s+'</button>'}).join('');
  var m=M[SYM];
  if(!FEED){$('app').classList.add('loading');return}
  $('app').classList.remove('loading');
  if(!m.ok){noData(m);others(M);foot(m);return}
  logEvents(m);
  hero(m);thesis(m);ideas(m);drawMap(m);timeline(m);expect(m);others(M);foot(m);
}
function topbar(){var c=ct();$('clock').textContent=c.wd+' '+String(c.h).padStart(2,'0')+':'+String(c.m).padStart(2,'0')+' CT';
  var mk=SYMS[SYM].crypto?{st:'open',t:T('CRIPTO ABIERTO 24/7','CRYPTO OPEN 24/7')}:market();var e=$('mk');e.className='mk '+mk.st;e.textContent=mk.t}

function hero(m){
  var v=VW[m.verdict]||VW.NODATA;$('vbox').style.setProperty('--vc',v[2]);$('vWord').textContent=vword(m.verdict);
  $('vSym').textContent=m.sym;$('vPx').textContent=fmt(m.price);
  var d=dirOf(m.bias);
  $('vDay').textContent=dayTypeTxt(m.dayType)+(m.plan.ok&&!m.plan.fresh?T(' · plan viejo',' · old plan'):'');
  var st=strength(m),col=m.bias==='SHORT'?'var(--down)':m.bias==='LONG'?'var(--up)':'var(--warn)';
  $('meter').innerHTML=[1,2,3,4,5].map(function(i){return '<i style="'+(i<=st?'background:'+col:'')+'"></i>'}).join('');
  $('vWhy').textContent=m.plan.fresh&&m.plan.reason?cut(m.plan.reason,170):T('Veredicto calculado en vivo: el agente aún no tiene plan fresco para este mercado.','Live verdict: the agent has no fresh plan for this market yet.');
  var stale=Date.now()-m.upd>40*60e3&&(SYMS[m.sym].crypto||market().st==='open');
  $('live').className='live'+(stale?' stale':'');
  $('liveT').textContent=(stale?T('DATOS VIEJOS · ','STALE DATA · '):T('EN VIVO · ','LIVE · '))+T('indicador hace ','indicator ')+ago(m.upd)+(LANG==='en'?' ago':'')+(m.barT?T(' · vela ',' · bar ')+hhmm(m.barT)+' CT':'');
  $('nowH').innerHTML=headline(m);
  $('nowTodo').textContent=todo(m);
  var vw=m.lv.vwap,t=m.cf.tick;
  var tclT=m.tcl==null?'·':(m.tcl>0?'▲ ':m.tcl<0?'▼ ':'· ')+(Math.abs(m.tcl)>=2?T('confirmada','confirmed'):Math.abs(m.tcl)===1?T('débil','weak'):T('neutral','neutral'));
  var facts=[
    [T('Sesgo','Bias'),'<span class="'+d[2]+'">'+d[3]+' '+T(d[0],d[1])+'</span>',T('semana ','week ')+dirOf(m.weekly)[3]],
    [T('Régimen','Regime'),esc(m.rg||m.regimeO||'·'),esc(m.struct.replace('dn','▼').replace('up','▲'))+(m.chop!=null?' · CI '+Math.round(m.chop):'')],

function drawMap(m){
  var map=$('map'),t=m.cf.tick,px=m.price,span=m.adr.atr?m.adr.atr*.3:m.cf.nml*t*6.4;
  var raw=[];
  Object.keys(m.lv).forEach(function(k){if(Math.abs(m.lv[k]-px)<=span)raw.push({k:k,p:m.lv[k]})});
  raw.sort(function(a,b){return b.p-a.p});
  var rows=[];raw.forEach(function(r){var last=rows[rows.length-1];
    if(last&&!last.p2&&Math.abs(last.p-r.p)<=t*3){last.n+=' · '+lvName(r.k);last.w+=' · '+lvDesc(r.k)}else rows.push({p:r.p,n:lvName(r.k),w:lvDesc(r.k)})});
  (m.plan.zones||[]).forEach(function(z){if(Math.abs((z.lo+z.hi)/2-px)<=span*1.3)rows.push({p:z.hi,p2:z.lo,n:T('Zona del plan ','Plan zone ')+(z.dir==='SHORT'?'▼':'▲'),w:T('marcada por el agente','marked by the agent'),kind:'zone plan',m:z.trig?cut(z.trig,150):''})});
  var fv=m.fvgs.filter(function(g){return g.hi>=px-span&&g.lo<=px+span}).sort(function(a,b){return Math.abs((a.lo+a.hi)/2-px)-Math.abs((b.lo+b.hi)/2-px)}).slice(0,3);
  fv.forEach(function(g){var inv=g.kind.charAt(0)==='i',bull=g.kind.indexOf('bull')>=0;rows.push({p:g.hi,p2:g.lo,n:g.tf+' '+(inv?'iFVG':'FVG')+' '+(bull?'▲':'▼'),w:T('hueco de precio','price gap'),kind:'zone',
    m:bull?T('Soporte: si barre y cierra dentro, puede rebotar.','Support: if it sweeps and closes inside, it can bounce.'):T('Resistencia: si llega y cierra de vuelta, puede girar.','Resistance: if it tags it and closes back, it can turn.')})});
  if(m.ntz){var a=Math.min(m.ntz[0],m.ntz[1]),b=Math.max(m.ntz[0],m.ntz[1]);if(b>=px-span&&a<=px+span)rows.push({p:Math.min(b,px+span),p2:Math.max(a,px-span),n:T('Tierra de nadie','No-man\'s land'),w:T('banda muerta entre bordes','dead band between edges'),kind:'zone ntz',m:T('No operar dentro. Si el precio entra, espera a que salga por un lado.','Don\'t trade inside. If price gets in, wait for it to leave on one side.')})}
  rows.push({p:px,n:T('PRECIO','PRICE'),w:T('último cierre','last close'),kind:'px',m:T('Aquí estás.','You are here.')});
  rows.forEach(function(r){var c=r.p2!=null?(r.p+r.p2)/2:r.p;r.dt=Math.round((c-px)/t);
    if(r.p2!=null&&px<=r.p&&px>=r.p2)r.dt=0;if(!r.kind)r.kind=r.dt>0?'res':'sup';if(r.m==null||r.m==='')r.m=meaning(m,r.dt>0)});
  rows.sort(function(a,b){return((b.p2!=null?(b.p+b.p2)/2:b.p)-(a.p2!=null?(a.p+a.p2)/2:a.p))});
  var hi=Math.max.apply(null,rows.map(function(r){return r.p})),lo=Math.min.apply(null,rows.map(function(r){return r.p2!=null?r.p2:r.p}));
  var narrow=innerWidth<620,AX=narrow?22:86,LX=narrow?50:118,H=520;
  function y(p){return 14+(hi-p)/((hi-lo)||1)*(H-28)}
  map.innerHTML='';map.style.height='auto';
  rows.forEach(function(r){var near=r.kind!=='px'&&r.kind.indexOf('ntz')<0&&Math.abs(r.dt)<=m.cf.nml*.6;
    var e=document.createElement('div');e.className='lv '+r.kind+(near?' near':'');
    var pr=r.p2!=null?fmt(r.p2)+' – '+fmt(r.p):fmt(r.p);
    e.innerHTML='<span class="n">'+esc(r.n)+'<small>'+esc(r.w)+'</small></span><span class="pd"><span class="p">'+pr+'</span><span class="d">'+(r.kind==='px'?'':dtx(r.dt,1))+'</span></span><span class="m">'+esc(r.m)+'</span>';

  rows.forEach(function(r){var key=r.kind.indexOf('ntz')>=0?'ntz':r.kind.indexOf('plan')>=0?'plan':r.kind.split(' ')[0],col=C[key];

    if(r.kind==='px')s+='<line x1="0" y1="'+r.y+'" x2="'+(AX-6)+'" y2="'+r.y+'" stroke="'+col+'" stroke-opacity=".4" stroke-dasharray="2 3"/>'});
  var sv=document.createElementNS('http://www.w3.org/2000/svg','svg');sv.setAttribute('aria-hidden','true');sv.innerHTML=s;map.insertBefore(sv,map.firstChild);
  $('mapSrc').textContent='± '+fmt(span)+(m.adr.atr?T(' (30 % del ADR)',' (30 % of ADR)'):'');
}

  $('nowH').textContent=T('No llegan datos de '+m.sym+'.','No data is arriving for '+m.sym+'.');
  $('nowTodo').textContent=T('El indicador no está mandando este mercado. Revisa su alerta en TradingView.','The indicator is not sending this market. Check its alert in TradingView.');
  ['facts','scen','ideas','avoid','map','tl','pred','news'].forEach(function(id){$(id).innerHTML=''});$('map').style.height='auto';
  $('thMain').textContent=T('Sin datos no hay tesis.','No data, no thesis.');$('thContra').textContent='·';$('thInv').textContent='·';$('thSrc').textContent='';$('mapSrc').textContent='';
}
function foot(m){
  var f=[];
  f.push('<span'+(ERR.feed?' class="bad"':'')+'>'+T('Indicador · ','Indicator · ')+(m&&m.ok?ago(m.upd)+(LANG==='en'?' ago':''):'·')+(ERR.feed?T(' · error al leer',' · read error'):'')+'</span>');
  var P=SYMS[SYM].plan==='fut'?PF:PC;f.push('<span'+(ERR.plan?' class="bad"':'')+'>'+T('Agente · ','Agent · ')+(P?esc(P.runType||'')+' · '+ago(Date.parse(P.generatedAt||P.builtAt||0))+(LANG==='en'?' ago':''):'·')+'</span>');
  f.push('<span>'+T('Se actualiza solo cada 45 s','Refreshes itself every 45 s')+'</span>');
  if(m&&m.plan&&m.plan.alarm&&m.plan.fresh)f.push('<span class="warn">⚠ '+esc(cut(m.plan.alarm,160))+'</span>');
  $('foot').innerHTML=f.join('');
}

/* ---------------- checklist (se reinicia cada día) ---------------- */
var CK=[['El precio está en un borde del mapa, no en tierra de nadie','Price is at an edge of the map, not in no-man\'s land'],['Voy a favor del sesgo, o tengo CISD confirmado si voy en contra','I am with the bias, or I have a confirmed CISD if I go against it'],['Tengo una vela de 5m cerrada que confirma','I have a closed 5m candle that confirms'],['Sé dónde va mi stop: detrás del nivel','I know where my stop goes: behind the level'],['Estoy tranquilo: no es revancha del trade anterior','I am calm: this is not revenge for the last trade']];
var ckState=(function(){try{var x=JSON.parse(ls('cc3_ck')||'null');return x&&x.d===todayKey()?x.v:[0,0,0,0,0]}catch(e){return[0,0,0,0,0]}})();
function drawCk(){
  $('chks').innerHTML=CK.map(function(c,i){return '<button class="chk" id="ck'+i+'" data-i="'+i+'" aria-pressed="'+(!!ckState[i])+'"><i>✓</i><span>'+T(c[0],c[1])+'</span></button>'}).join('');
  var n=ckState.filter(Boolean).length,ok=n===CK.length;
  document.querySelectorAll('#segs i').forEach(function(x,i){x.classList.toggle('on',i<n)});$('segs').classList.toggle('ok',ok);
  var g=$('gate');g.className='gate'+(ok?' ok':'');g.textContent=ok?T('✓ CUMPLE EL PLAN · TÚ DECIDES','✓ FITS THE PLAN · YOUR CALL'):n+' / '+CK.length+T(' · SI FALTA UNO, NO HAY TRADE',' · ONE MISSING, NO TRADE');
}
$('chks').addEventListener('click',function(e){var b=e.target.closest('.chk');if(!b)return;var i=+b.dataset.i;ckState[i]=ckState[i]?0:1;ls('cc3_ck',JSON.stringify({d:todayKey(),v:ckState}));drawCk()});
$('ckReset').addEventListener('click',function(){ckState=[0,0,0,0,0];ls('cc3_ck',JSON.stringify({d:todayKey(),v:ckState}));drawCk()});

/* ---------------- eventos de la página ---------------- */
function pick(s){if(!SYMS[s])return;SYM=s;ls('cc3_sym',s);render()}
$('syms').addEventListener('click',function(e){var b=e.target.closest('.sym');if(b)pick(b.dataset.s)});
$('oth').addEventListener('click',function(e){var b=e.target.closest('.ot');if(b){pick(b.dataset.s);scrollTo({top:0,behavior:'smooth'})}});
document.querySelectorAll('.lng').forEach(function(b){b.addEventListener('click',function(){LANG=b.dataset.l;ls('cc_lang',LANG);render();drawCk()})});
var rz;addEventListener('resize',function(){clearTimeout(rz);rz=setTimeout(render,150)});
addEventListener('keydown',function(e){if(e.target.closest&&e.target.closest('input,textarea'))return;var i='12345'.indexOf(e.key);if(i>=0&&!e.metaKey&&!e.ctrlKey&&!e.altKey)pick(ORDER[i])});

/* ---------------- datos ---------------- */
function getJSON(u){return fetch(u,{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error(r.status);return r.json()})}
function loadFeed(){return getJSON(API+'/api/session-feed').then(function(d){FEED=d;ERR.feed=0;LAST.feed=Date.now()}).catch(function(){ERR.feed=1})}
function loadPlans(){return Promise.all([
  getJSON(BUS+'latest.json?t='+Date.now()).then(function(d){PF=d;ERR.plan=0}).catch(function(){ERR.plan=1}),
  getJSON(BUS+'crypto-latest.json?t='+Date.now()).then(function(d){PC=d}).catch(function(){})])}
function loadNews(){return getJSON(API+'/api/cc-news').then(function(d){NEWS=d}).catch(function(){})}
drawCk();render();
Promise.all([loadFeed(),loadPlans(),loadNews()]).then(render);
setInterval(function(){loadFeed().then(render)},45e3);
setInterval(function(){loadPlans().then(render)},5*60e3);
setInterval(function(){loadNews().then(render)},30*60e3);
setInterval(topbar,30e3);
document.addEventListener('visibilitychange',function(){if(!document.hidden)loadFeed().then(render)});
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(render);
})();
</script>
</body>
</html>
