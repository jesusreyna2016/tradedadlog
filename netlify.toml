[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[functions]
  directory = "netlify/functions"

# Rutas limpias para las funciones del Command Center
[[redirects]]
  from = "/api/cc-ingest"
  to = "/.netlify/functions/cc-ingest"
  status = 200

[[redirects]]
  from = "/api/cc-plan"
  to = "/.netlify/functions/cc-plan"
  status = 200

[[redirects]]
  from = "/api/cc-news"
  to = "/.netlify/functions/cc-news"
  status = 200

[[redirects]]
  from = "/api/cc-scan"
  to = "/.netlify/functions/cc-scan"
  status = 200

# Session Analyst · ingesta de indicadores, feed unificado y plan de sesion
[[redirects]]
  from = "/api/ind-ingest"
  to = "/.netlify/functions/ind-ingest"
  status = 200

[[redirects]]
  from = "/api/session-feed"
  to = "/.netlify/functions/session-feed"
  status = 200

[[redirects]]
  from = "/api/session-plan-ingest"
  to = "/.netlify/functions/session-plan-ingest"
  status = 200

[[redirects]]
  from = "/api/session-plan"
  to = "/.netlify/functions/session-plan"
  status = 200
