[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[functions]
  directory = "netlify/functions"

# Rutas limpias para las funciones del Command Center
[[redirects]]
  from = "/api/cc-ingest"
  to = "/.netlify/functions/cc-ingest"
  status = 200

[[redirects]]
  from = "/api/cc-plan"
  to = "/.netlify/functions/cc-plan"
  status = 200

[[redirects]]
  from = "/api/cc-news"
  to = "/.netlify/functions/cc-news"
  status = 200

[[redirects]]
  from = "/api/cc-scan"
  to = "/.netlify/functions/cc-scan"
  status = 200

# Session Analyst · ingesta de indicadores, feed unificado y plan de sesion
[[redirects]]
  from = "/api/ind-ingest"
  to = "/.netlify/functions/ind-ingest"
  status = 200

[[redirects]]
  from = "/api/session-feed"
  to = "/.netlify/functions/session-feed"
  status = 200

[[redirects]]
  from = "/api/session-plan-ingest"
  to = "/.netlify/functions/session-plan-ingest"
  status = 200

[[redirects]]
  from = "/api/session-plan"
  to = "/.netlify/functions/session-plan"
  status = 200

[[redirects]]
  from = "/api/sa-state-ingest"
  to = "/.netlify/functions/sa-state-ingest"
  status = 200

# Fase 5b: digest de-identificado de disciplina del journal -> bus (live/journal.json)
[[redirects]]
  from = "/api/journal-ingest"
  to = "/.netlify/functions/journal-ingest"
  status = 200

[[redirects]]
  from = "/api/sa-state"
  to = "/.netlify/functions/sa-state"
  status = 200

# Snapshot del bus GitHub (cron cada 5 min; tambien invocable a mano para probar)
[[redirects]]
  from = "/api/sa-bus-snapshot"
  to = "/.netlify/functions/sa-bus-snapshot"
  status = 200

# X Growth Agent: boton "ya lo publique" del dashboard -> live/marked-posted.json
[[redirects]]
  from = "/api/x-growth-mark-posted"
  to = "/.netlify/functions/x-growth-mark-posted"
  status = 200

# Scalp CC · agente de aprendizaje: ingesta de señales/resultados del parche SCC1|
[[redirects]]
  from = "/api/scalp-ingest"
  to = "/.netlify/functions/scalp-ingest"
  status = 200

# Scalp CC · snapshot del bus scalp-cc-bus (cron cada 10 min; invocable a mano para probar)
[[redirects]]
  from = "/api/scalp-bus-snapshot"
  to = "/.netlify/functions/scalp-bus-snapshot"
  status = 200

# Scalp CC · feed del dashboard (public/scalp.html)
[[redirects]]
  from = "/api/scalp-state"
  to = "/.netlify/functions/scalp-state"
  status = 200

# TDL Plan Coach · ingesta del feed de trading_plan_agent.pine (store 'plan-coach',
# separado de 'scalp' a proposito, ver plan-coach-ingest.mjs)
[[redirects]]
  from = "/api/plan-coach-ingest"
  to = "/.netlify/functions/plan-coach-ingest"
  status = 200

# TDL Plan Coach · feed de lectura (eventos recientes + conteos)
[[redirects]]
  from = "/api/plan-coach-state"
  to = "/.netlify/functions/plan-coach-state"
  status = 200
